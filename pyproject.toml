[project]
name = "pwa_app"
authors = [
    { name = "Krystaa", email = "hello@krystaa.com"}
]
description = "Unified PWA for RMA, Dispatch & HRMS operations"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
