                const bankForm = reactive({ bank_name: '', bank_ac_no: '', ifsc_code: '', branch: '' });
                const bankSaving = ref(false);
                const activeOverlay = ref(null);
                const showLogoutConfirm = ref(false);
                const passForm = reactive({ old: '', new1: '', new2: '' });
                const passSaving = ref(false);
                const passError = ref('');
                const passSuccess = ref(false);
                const notifSettings = reactive({ push: true, email: true, attendance: true });
                const navigatorUserAgent = ref(navigator.userAgent || '');
                const primaryRole = computed(() => {
                    const roles = SESSION.roles;
                    if (roles.includes('System Manager')) return 'System Manager';
                    if (roles.includes('HR Manager')) return 'HR Manager';
                    if (roles.includes('RMA Manager')) return 'RMA Manager';
                    if (roles.includes('Dispatch Manager')) return 'Dispatch Manager';
                    return roles[0] || 'User';
                });
                const photoInput = ref(null);

                async function loadProfile() {
                    try {
                        const res = await api.method('pwa_app.api.profile.get_profile');
                        const data = res.message || {};
                        Object.assign(profile, data);
                        if (data.employee) Object.assign(profile, data.employee);
                    } catch (e) { toast('Failed to load profile', 'error'); }
                    finally { loading.value = false; }
                }

                async function loadBank() {
                    try {
                        const res = await api.method('pwa_app.api.profile.get_bank_details');
                        const data = res.message || {};
                        Object.assign(bank, data);
                        Object.assign(bankForm, data);
                    } catch (e) {}
                }

                async function saveBank() {
                    bankSaving.value = true;
                    try {
                        await api.method('pwa_app.api.profile.update_bank_details', {
                            bank_name: bankForm.bank_name,
                            bank_ac_no: bankForm.bank_ac_no,
                            ifsc_code: bankForm.ifsc_code,
                            branch: bankForm.branch,
                        });
                        Object.assign(bank, bankForm);
                        toast('Bank details saved!', 'success');
                        activeOverlay.value = null;
                    } catch (e) { toast('Failed: ' + (e.message || 'Error'), 'error'); }
                    finally { bankSaving.value = false; }
                }

                async function changePassword() {
                    passError.value = '';
                    passSuccess.value = false;
                    if (!passForm.old || !passForm.new1 || !passForm.new2) { passError.value = 'All fields required'; return; }
                    if (passForm.new1 !== passForm.new2) { passError.value = 'Passwords do not match'; return; }
                    if (passForm.new1.length < 6) { passError.value = 'Password must be at least 6 characters'; return; }
                    passSaving.value = true;
                    try {
                        await api.method('pwa_app.api.profile.change_password', {
                            old_password: passForm.old,
                            new_password: passForm.new1,
                        });
                        passSuccess.value = true;
                        passForm.old = ''; passForm.new1 = ''; passForm.new2 = '';
                        toast('Password changed!', 'success');
                    } catch (e) { passError.value = e.message || 'Failed to change password'; }
                    finally { passSaving.value = false; }
                }

                function confirmLogout() { showLogoutConfirm.value = true; }

                function doLogout() { fetch('/api/method/logout',{method:'POST',headers:{'X-Frappe-CSRF-Token':SESSION.csrf}}).catch(function(){}).then(function(){ window.location.href='/install/app'; }); }

                function triggerPhotoUpload() { photoInput.value?.click(); }

                async function onPhotoFile(e) {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    try {
                        const formData = new FormData();
                        formData.append('file', file, 'profile.jpg');
                        formData.append('doctype', 'Employee');
                        formData.append('docname', profile.name);
                        formData.append('fieldname', 'image');
                        await api.upload('frappe.core.api.file.upload', formData);
                        toast('Photo updated!', 'success');
                        await loadProfile();
                    } catch (e) { toast('Upload failed: ' + (e.message || 'Error'), 'error'); }
                }

                onMounted(loadProfile);
                const appVersion = "1.0 Beta";
                return { loading, profile, bank, bankForm, bankSaving, activeOverlay, showLogoutConfirm, passForm, passSaving, passError, passSuccess, notifSettings, navigatorUserAgent, primaryRole, photoInput, loadBank, saveBank, changePassword, confirmLogout, doLogout, triggerPhotoUpload, onPhotoFile, appVersion };
            }
        };

        // --- Placeholder ---
        const Placeholder = { props: ["title", "desc"], template: '<div class="px-4 py-6"><div class="bg-surface-container-lowest p-6 rounded-2xl border border-outline-variant/10 soft-shadow text-center"><span class="material-symbols-outlined text-[48px] text-outline/40 mb-3">construction</span><h3 class="text-headline-md font-bold text-on-surface">{{ title }}</h3><p class="text-body-md text-outline mt-2">{{ desc || "Coming soon." }}</p></div></div>' };

        // --- Native Search ---
        const NativeSearch = {
            template: `
                <div class="min-h-screen bg-background">
                    <div class="sticky top-0 bg-surface z-30 border-b border-outline-variant/20">
                        <div class="flex items-center gap-3 px-4 h-14">
                            <button @click="goBack" class="w-9 h-9 rounded-full bg-surface-container-low flex items-center justify-center shrink-0">
                                <span class="material-symbols-outlined">arrow_back</span>
                            </button>
                            <div class="flex-1 relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
                                <input ref="searchInput" v-model="query" @input="debouncedSearch" @keydown.escape="query='';results=[]" class="w-full pl-10 pr-4 py-2.5 rounded-full bg-surface-container-low border-none text-body-md placeholder:text-outline/50 focus:ring-2 focus:ring-primary/30 outline-none" placeholder="Search everything...">
                            </div>
                        </div>
                    </div>
                    <div class="px-4 py-4 space-y-4">
                        <template v-if="loading">
                            <div v-for="i in 5" :key="i" class="h-16 bg-surface-container-low rounded-xl animate-pulse"></div>
                        </template>
                        <template v-else-if="results.length">
                            <div v-for="group in groupedResults" :key="group.doctype" class="space-y-2">
                                <h3 class="text-label-md font-bold text-outline uppercase tracking-wider px-1">{{ group.doctype }} ({{ group.items.length }})</h3>
                                <div v-for="r in group.items" :key="r.name" @click="openResult(r)" class="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/10 flex items-center gap-3 cursor-pointer active:scale-[0.98] transition-all">
                                    <div class="min-w-0 flex-1">
                                        <p class="text-label-md font-bold text-on-surface truncate">{{ r.label }}</p>
                                        <p class="text-label-sm text-outline truncate" v-if="r.description">{{ r.description }}</p>
                                    </div>
                                    <span class="px-2 py-0.5 rounded-full bg-surface-container-high text-label-sm text-outline whitespace-nowrap shrink-0">{{ r.doctype }}</span>
                                </div>
                            </div>
                        </template>
                        <div v-else-if="query && !loading" class="text-center py-10 text-outline">
                            <span class="material-symbols-outlined text-[48px] text-outline/40 mb-2">search_off</span>
                            <p class="text-label-sm">No results for "{{ query }}"</p>
                        </div>
                        <div v-else class="text-center py-10 text-outline">
                            <span class="material-symbols-outlined text-[48px] text-outline/40 mb-2">search</span>
                            <p class="text-label-sm">Type to search across all modules</p>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const query = ref('');
                const loading = ref(false);
                const results = ref([]);
                const searchInput = ref(null);

                const groupedResults = computed(() => {
                    const map = {};
                    for (const r of results.value) {
                        if (!map[r.doctype]) map[r.doctype] = { doctype: r.doctype, items: [] };
                        map[r.doctype].items.push(r);
                    }
                    return Object.values(map).sort((a, b) => b.items.length - a.items.length);
                });

                let debounceTimer = null;
                function debouncedSearch() {
                    clearTimeout(debounceTimer);
                    if (!query.value || query.value.length < 2) { results.value = []; loading.value = false; return; }
                    loading.value = true;
                    debounceTimer = setTimeout(async () => {
                        try {
                            const res = await api.method('pwa_app.api.search.global_search', { text: query.value, limit: 30 });
                            results.value = res.message || [];
                        } catch (e) { console.error(e); results.value = []; }
                        finally { loading.value = false; }
                    }, 300);
                }

                function openResult(r) {
                    if (r.route) window.location.href = r.route;
                    else toast('Opening ' + r.name, 'info');
                }

                function goBack() { if (window.history.length > 1) window.history.back(); else window.location.href = '/install/app'; }

                onMounted(() => { setTimeout(() => { if (searchInput.value) searchInput.value.focus(); }, 200); });

                return { query, loading, results, searchInput, groupedResults, debouncedSearch, openResult, goBack };
            }
        };

        // ============================================================
        // Routes
        // ============================================================
        const routes = [
            { path: "/", redirect: "/dashboard" },
            { path: "/dashboard", component: Dashboard, meta: { title: "Dashboard", bottomNav: true } },
            { path: "/attendance", component: Attendance, meta: { title: "Attendance", bottomNav: true } },
            { path: "/search", component: NativeSearch, meta: { title: "Search", bottomNav: true } },
            { path: "/profile", component: Profile, meta: { title: "Profile", bottomNav: true } },
            { path: "/leaves", component: Leaves, meta: { title: "Leaves" } },
            { path: "/salary", component: Placeholder, meta: { title: "Salary" }, props: { title: "Salary Slips", desc: "View and download your salary slips." } },
            { path: "/hr-dashboard", component: HRDashboard, meta: { title: "HR Dashboard" } },
            { path: "/expenses", component: Expenses, meta: { title: "Expenses" } },
            { path: "/dispatch", component: Dispatch, meta: { title: "Dispatch" } },
            { path: "/rma", component: RMA, meta: { title: "RMA" } },
            { path: "/checkin-logs", component: CheckinLogs, meta: { title: "Check-in Logs" } },
            { path: "/items", component: Items, meta: { title: "Items" } },
            { path: "/directory", component: Directory, meta: { title: "Directory" } },
            { path: "/comms", component: Comms, meta: { title: "Comms" } },
            { path: "/mail", component: Mail, meta: { title: "Mail" } },
            { path: "/customers", component: Customers, meta: { title: "Customers" } },
            { path: "/all", component: Placeholder, meta: { title: "All Features" }, props: { title: "All Features", desc: "All available modules and shortcuts." } },
        ];

        const router = createRouter({ history: createWebHistory("/install/app"), routes });

        // ============================================================
        // Main App
        // ============================================================
        const AppComponent = {
            template: `
                <div class="min-h-screen bg-background">
                    <!-- Toast -->
                    <div class="fixed top-4 right-4 z-[600] flex flex-col gap-2 pointer-events-none">
                        <div v-for="t in toasts" :key="t.id" class="px-4 py-3 rounded-2xl text-label-md font-bold text-white shadow-lg pointer-events-auto" :class="t.type === 'success' ? 'bg-green-600' : t.type === 'error' ? 'bg-red-600' : t.type === 'warning' ? 'bg-yellow-600' : 'bg-inverse-surface'">{{ t.msg }}</div>
                    </div>

                    <!-- Offline banner -->
                    <div v-if="!online" class="fixed top-0 left-0 w-full z-[100] bg-yellow-500 text-white text-center py-2 text-label-sm font-bold">Offline - limited features</div>


                    <!-- Header - hidden on dashboard for seamless experience -->
                    <header v-if="showHeader" class="fixed top-0 left-0 w-full z-50 bg-transparent flex justify-between items-center px-4 h-16" :class="animClass('animate-slide-down')">
                        <button @click="drawerOpen = !drawerOpen" class="w-11 h-11 flex items-center justify-center bg-white/90 backdrop-blur-md rounded-full text-on-surface soft-shadow active:scale-95 transition-all border border-outline-variant/10">
                            <span class="material-symbols-outlined">menu</span>
                        </button>
                        <div class="flex items-center gap-2">
                            <button @click="notifOpen = !notifOpen" class="notif-trigger relative w-11 h-11 flex items-center justify-center bg-white/90 backdrop-blur-md rounded-full text-on-surface soft-shadow active:scale-95 transition-all border border-outline-variant/10">
                                <span class="material-symbols-outlined">notifications</span>
                                <span v-if="notifUnread > 0" class="absolute top-1.5 right-1.5 min-w-[18px] h-[18px] flex items-center justify-center bg-error text-white text-[10px] font-bold rounded-full px-1">{{ notifUnread > 99 ? '99+' : notifUnread }}</span>
                            </button>
                            <div @click="$router.push('/profile')" class="flex items-center gap-2 bg-white/90 backdrop-blur-md pl-3 pr-1.5 py-1.5 rounded-full border border-outline-variant/20 soft-shadow cursor-pointer active:scale-95 transition-all">
                                <span class="text-label-sm font-bold text-on-surface max-w-[80px] truncate">{{ userFullName }}</span>
                                <div class="w-8 h-8 rounded-full overflow-hidden border border-primary/20 bg-primary flex items-center justify-center text-white text-label-sm font-bold">{{ userInitial }}</div>
                            </div>
                        </div>
                    </header>

                    <!-- Notifications dropdown -->
                    <div ref="notifDropdownRef" v-if="notifOpen" class="notif-dropdown fixed top-16 right-4 z-[300] w-[340px] max-h-[60vh] bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-xl overflow-hidden" :class="animClass('animate-fade-in-up')">
                        <div class="flex items-center justify-between p-4 border-b border-outline-variant/10">
                            <h3 class="text-label-md font-bold text-on-surface">Notifications</h3>
                            <button @click="markAllNotifRead" class="text-primary text-label-sm font-bold">Mark all read</button>
                        </div>
                        <div class="overflow-y-auto max-h-[calc(60vh-56px)]">
                            <div v-if="notifications.length" class="divide-y divide-outline-variant/10">
                                <div v-for="n in notifications" :key="n.name" @click="openNotif(n)" class="flex items-start gap-3 p-4 cursor-pointer hover:bg-surface-container-low transition-colors" :class="!n.read ? 'bg-primary/5' : ''">
                                    <div class="w-2 h-2 rounded-full mt-1.5 shrink-0" :class="n.read ? 'bg-transparent' : 'bg-primary'"></div>
                                    <div class="min-w-0 flex-1">
                                        <p class="text-label-sm font-bold text-on-surface truncate">{{ n.subject }}</p>
                                        <p class="text-label-sm text-outline mt-0.5">{{ n.type }} · {{ n.time_ago || n.creation }}</p>
                                    </div>
                                </div>
                            </div>
                            <div v-else class="text-center py-8 text-outline text-label-sm">No notifications</div>
                        </div>
                    </div>

                    <!-- Drawer overlay -->
                    <div class="fixed inset-0 bg-black/40 z-[200] transition-opacity duration-300" :class="drawerOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'" @click="drawerOpen = false"></div>

                    <!-- Drawer -->
                    <div class="fixed top-0 left-0 bottom-0 w-[280px] bg-white z-[201] flex flex-col transition-transform duration-300" :class="drawerOpen ? 'translate-x-0' : '-translate-x-full'">
                        <div class="bg-primary text-white p-6 pb-4">
                            <h2 class="text-headline-md font-bold">Krystaa Suite</h2>
                            <p class="text-label-sm text-white/80 mt-1">{{ userFullName }}</p>
                        </div>
                        <nav class="flex-1 overflow-y-auto py-2">
                            <router-link v-for="item in navItems" :key="item.path" :to="item.path" @click="drawerOpen = false" class="flex items-center gap-4 px-5 py-3 text-on-surface text-body-md font-medium hover:bg-surface-container-low transition-colors" :class="$route.path === item.path ? 'bg-primary/5 text-primary border-l-3 border-primary font-bold' : ''">
                                <span class="material-symbols-outlined text-[22px]">{{ item.icon }}</span> {{ item.label }}
                            </router-link>
                        </nav>
                        <div class="p-4 border-t border-outline-variant/10">
                            <button @click="logout" class="flex items-center gap-3 text-red-600 text-body-md font-medium"><span class="material-symbols-outlined">logout</span> Sign out</button>
                        </div>
                    </div>

                    <!-- Main content -->
                    <main class="pb-20 min-h-screen" :class="showHeader ? 'pt-16' : ''">
                        <router-view />
                    </main>

                    <!-- Bottom Nav -->
                    <nav v-if="showBottomNav" class="fixed bottom-0 left-0 w-full flex justify-around items-center py-3 bg-white/95 backdrop-blur-md border-t border-outline-variant/20 z-50" :class="animClass('animate-slide-up-nav')">
                        <router-link v-for="tab in bottomTabs" :key="tab.route" :to="tab.route" class="flex flex-col items-center justify-center w-1/4 active:scale-95 transition-all duration-200" :class="isActive(tab.route) ? 'text-primary font-bold' : 'text-outline'">
                            <span class="material-symbols-outlined text-[24px]" :style="isActive(tab.route) ? 'font-variation-settings: FILL 1' : ''">{{ tab.icon }}</span>
                            <span class="text-label-sm mt-1">{{ tab.label }}</span>
                        </router-link>
                    </nav>
                </div>
            `,
            setup() {
                const drawerOpen = ref(window._appState?.drawerOpen || false);
                watch(drawerOpen, (v) => { if (window._appState) window._appState.drawerOpen = v; });
                if (window._appState) {
                    watch(() => window._appState.drawerOpen, (v) => { drawerOpen.value = v; });
                }
                const online = ref(navigator.onLine);
                const userFullName = ref(SESSION.fullName || SESSION.user);
                const userInitial = computed(() => (userFullName.value || '?')[0].toUpperCase());
                const primaryRole = computed(() => {
                    const roles = SESSION.roles;
                    if (roles.includes("System Manager")) return "System Manager";
                    if (roles.includes("HR Manager")) return "HR Manager";
                    if (roles.includes("RMA Manager")) return "RMA Manager";
                    if (roles.includes("Dispatch Manager")) return "Dispatch Manager";
                    return roles[0] || "User";
                });

                // Notifications
                const notifOpen = ref(false);
                const notifications = ref([]);
                const notifUnread = ref(0);
                let notifPollTimer = null;

                async function fetchNotifications() {
                    try {
                        const [listRes, countRes] = await Promise.allSettled([
                            api.method('pwa_app.api.notifications.get_notifications'),
                            api.method('pwa_app.api.notifications.get_unread_count'),
                        ]);
                        if (listRes.status === 'fulfilled') notifications.value = listRes.value.message || [];
                        if (countRes.status === 'fulfilled') notifUnread.value = countRes.value.message?.count || 0;
                    } catch (e) {}
                }

                async function markAllNotifRead() {
                    try { await api.method('pwa_app.api.notifications.mark_all_read'); notifications.value.forEach(n => n.read = true); notifUnread.value = 0; toast('All marked read', 'success'); }
                    catch (e) {}
                }

                function openNotif(n) {
                    if (!n.read) {
                        api.method('pwa_app.api.notifications.mark_read', { name: n.name }).catch(() => {});
                        n.read = true;
                        notifUnread.value = Math.max(0, notifUnread.value - 1);
                    }
                    notifOpen.value = false;
                    const route = getRouteForNotif(n);
                    if (route) router.push(route);
                }

                function getRouteForNotif(n) {
                    const map = {
                        "Leave Application": "/leaves",
                        "Expense Claim": "/expenses",
                        "Employee Advance": "/attendance",
                        "Employee Checkin": "/checkin-logs",
                        "Attendance Request": "/leaves",
                        "Shift Request": "/attendance",
                        "Compensatory Leave Request": "/leaves",
                    };
                    return map[n.document_type] || null;
                }


                const showHeader = computed(() => router.currentRoute.value.path !== '/dashboard');
                const showBottomNav = computed(() => router.currentRoute.value.meta?.bottomNav);
                const bottomTabs = [
                    { route: "/dashboard", icon: "home", label: "Home" },
                    { route: "/attendance", icon: "schedule", label: "Attendance" },
                    { route: "/search", icon: "search", label: "Search" },
                    { route: "/profile", icon: "account_circle", label: "Profile" },
                ];

                function isActive(route) { return router.currentRoute.value.path === route; }
                function animClass(cls) { return supportsAnimations ? cls : ''; }

                const navItems = computed(() => [
                    { path: "/dashboard", label: "Dashboard", icon: "dashboard", show: true },
                    { path: "/attendance", label: "Attendance", icon: "schedule", show: true },
                    { path: "/hr-dashboard", label: "HR Dashboard", icon: "badge", show: isHR() },
                    { path: "/leaves", label: "Leaves", icon: "calendar_today", show: true },
                    { path: "/rma", label: "RMA", icon: "build", show: isRMA() },
                    { path: "/dispatch", label: "Dispatch", icon: "local_shipping", show: isDispatch() },
                    { path: "/items", label: "Items", icon: "inventory_2", show: true },
                    { path: "/directory", label: "Directory", icon: "contacts", show: true },
                    { path: "/checkin-logs", label: "Check-in Logs", icon: "history", show: true },
                    { path: "/customers", label: "Customers", icon: "people", show: true },
                    { path: "/mail", label: "Mail", icon: "mail", show: true },
                    { path: "/comms", label: "Comms", icon: "campaign", show: false },
                ].filter(i => i.show).map(({show, ...rest}) => rest));

                function logout() { fetch('/api/method/logout',{method:'POST',headers:{'X-Frappe-CSRF-Token':SESSION.csrf}}).catch(function(){}).then(function(){ window.location.href='/install/app'; }); }

                // Click outside to close notification dropdown
                const notifDropdownRef = ref(null);
                function handleClickOutside(e) {
                    if (notifOpen.value && notifDropdownRef.value) {
                        const target = e.target;
                        if (!notifDropdownRef.value.contains(target) && !target.closest('.notif-trigger')) {
                            notifOpen.value = false;
                        }
                    }
                }

                function urlBase64ToUint8Array(base64String) {
                    var padding = '='.repeat((4 - base64String.length % 4) % 4);
                    var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
                    var rawData = window.atob(base64);
                    var output = new Uint8Array(rawData.length);
                    for (var i = 0; i < rawData.length; ++i) output[i] = rawData.charCodeAt(i);
                    return output;
                }
                function updateOnline() { online.value = navigator.onLine; }
                onMounted(() => {

                    window.addEventListener("online", updateOnline);
                    window.addEventListener("offline", updateOnline);
                    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/assets/pwa_app/sw.js?v=" + (SESSION.csrf || "1")).catch(() => {});
                    // Push notification subscription
                    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
                    if ("Notification" in window && Notification.permission === "granted" && "serviceWorker" in navigator && "PushManager" in window) {
                        navigator.serviceWorker.ready.then(async (reg) => {
                            try {
                                const existingSub = await reg.pushManager.getSubscription();
                                if (existingSub) return;
                                const pubKeyRes = await api.method('pwa_app.api.push_notification.get_vapid_public_key');
                                const pubKey = pubKeyRes.message;
                                if (!pubKey) return;
                                const sub = await reg.pushManager.subscribe({
                                    userVisibleOnly: true,
                                    applicationServerKey: urlBase64ToUint8Array(pubKey)
                                });
                                await fetch('/api/method/pwa_app.api.push_notification.subscribe', {
                                    method: 'POST', credentials: 'include',
                                    headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': SESSION.csrf },
                                    body: JSON.stringify({ subscription: JSON.stringify(sub.toJSON()), device_name: navigator.userAgent })
                                });
                            } catch(e) { console.warn('Push sub failed:', e); }
                        });
                    }
                    if ("geolocation" in navigator) navigator.permissions.query({ name: 'geolocation' }).then(r => {
                        if (r.state === 'prompt') toast('Enable GPS for check-in', 'info', 5000);
                    });
                    fetchNotifications();
                    notifPollTimer = setInterval(fetchNotifications, 30000);
                    document.addEventListener('click', handleClickOutside);
                });
                onUnmounted(() => {
                    window.removeEventListener("online", updateOnline);
                    window.removeEventListener("offline", updateOnline);
                    if (notifPollTimer) clearInterval(notifPollTimer);
                    document.removeEventListener('click', handleClickOutside);
                });

                return { drawerOpen, online, userFullName, userInitial, primaryRole, showHeader, showBottomNav, bottomTabs, isActive, navItems, logout, toasts, animClass, notifOpen, notifDropdownRef, notifications, notifUnread, fetchNotifications, markAllNotifRead, openNotif, };
            }
        };

        // ============================================================
        // Mount with error boundary
        // ============================================================
        const app = createApp(AppComponent);
        app.config.errorHandler = (err, vm, info) => {
            console.error('Vue error:', err, info);
            toast('Something went wrong. Please refresh the page.', 'error', 5000);
        };
        app.use(router);
        app.mount("#app");
        {% endraw %}
    </script>
{% endif %}
</body>
</html>
