<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krystaa</title>
    <link rel="manifest" href="/assets/pwa_app/manifest.json">
    <meta name="theme-color" content="#004ac6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff", "on-tertiary": "#ffffff", "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff", "surface": "#f7f9fb",
                        "secondary-fixed": "#d3e4fe", "primary-fixed-dim": "#b4c5ff",
                        "background": "#f7f9fb", "primary": "#004ac6",
                        "on-surface-variant": "#434655", "tertiary-container": "#656d84",
                        "surface-variant": "#e0e3e5", "outline-variant": "#c3c6d7",
                        "on-tertiary-container": "#eef0ff", "surface-tint": "#0053db",
                        "surface-container-high": "#e6e8ea", "secondary": "#505f76",
                        "surface-dim": "#d8dadc", "on-primary": "#ffffff",
                        "primary-container": "#2563eb", "on-tertiary-fixed": "#131b2e",
                        "outline": "#737686", "tertiary-fixed": "#dae2fd",
                        "on-primary-fixed-variant": "#003ea8", "surface-bright": "#f7f9fb",
                        "tertiary": "#4d556b", "primary-fixed": "#dbe1ff",
                        "on-secondary-fixed": "#0b1c30", "on-surface": "#191c1e",
                        "secondary-fixed-dim": "#b7c8e1", "on-secondary-fixed-variant": "#38485d",
                        "secondary-container": "#d0e1fb", "surface-container-highest": "#e0e3e5",
                        "surface-container": "#eceef0", "surface-container-low": "#f2f4f6",
                        "on-error-container": "#93000a", "tertiary-fixed-dim": "#bec6e0",
                        "inverse-primary": "#b4c5ff", "inverse-on-surface": "#eff1f3",
                        "on-background": "#191c1e", "on-primary-container": "#eeefff",
                        "error-container": "#ffdad6", "on-secondary": "#ffffff",
                        "inverse-surface": "#2d3133", "on-primary-fixed": "#00174b",
                        "on-secondary-container": "#54647a", "on-tertiary-fixed-variant": "#3f465c"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": { "margin-mobile": "16px", "margin-desktop": "40px", "margin-safe": "16px", "xs": "4px", "2xl": "48px", "base": "4px", "md": "16px", "gutter": "12px", "xl": "32px", "3xl": "64px", "lg": "24px", "sm": "12px" },
                    "fontFamily": { "headline-md": ["Manrope"], "body-sm": ["Inter"], "label-md": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Manrope"], "body-md": ["Inter"], "body-lg": ["Inter"], "display-lg": ["Manrope"] },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "1", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}]
                    },
                    "animation": {
                        "slide-down": "slide-down 0.6s ease-out forwards",
                        "fade-in-scale": "fade-in-scale 0.6s ease-out 0.2s forwards",
                        "fade-in-up": "fade-in-up 0.5s ease-out forwards",
                        "slide-up-nav": "slide-up-nav 0.4s ease-out forwards",
                        "pulse-soft": "pulse-soft 2s infinite"
                    },
                    "keyframes": {
                        "slide-down": { "0%": { transform: "translateY(-100%)", opacity: "0" }, "100%": { transform: "translateY(0)", opacity: "1" } },
                        "fade-in-scale": { "0%": { transform: "scale(0.95)", opacity: "0" }, "100%": { transform: "scale(1)", opacity: "1" } },
                        "fade-in-up": { "0%": { transform: "translateY(20px)", opacity: "0" }, "100%": { transform: "translateY(0)", opacity: "1" } },
                        "slide-up-nav": { "0%": { transform: "translateY(100%)" }, "100%": { transform: "translateY(0)" } },
                        "pulse-soft": { "0%, 100%": { boxShadow: "0 0 0 0 rgba(0, 74, 198, 0.4)" }, "50%": { boxShadow: "0 0 0 12px rgba(0, 74, 198, 0)" } }
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; line-height: 1; text-transform: none; letter-spacing: normal; word-wrap: normal; white-space: nowrap; direction: ltr; }
        .soft-shadow { box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.04); }
        body { background-color: #f7f9fb; color: #191c1e; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .delay-100 { animation-delay: 0.1s; } .delay-150 { animation-delay: 0.15s; } .delay-200 { animation-delay: 0.2s; }
        .delay-250 { animation-delay: 0.25s; } .delay-300 { animation-delay: 0.3s; } .delay-350 { animation-delay: 0.35s; }
        .pill-shadow { box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05); }
        .px-margin-safe { padding-left: 16px; padding-right: 16px; }
        .gap-sm { gap: 12px; }
        .gap-gutter { gap: 12px; }
        .p-md { padding: 16px; }
        .space-y-gutter > :not([hidden]) ~ :not([hidden]) { --tw-space-y-reverse: 0; margin-top: calc(12px * (1 - var(--tw-space-y-reverse))); margin-bottom: calc(12px * var(--tw-space-y-reverse)); }
    </style>
</head>
<body class="flex flex-col min-h-screen font-body-md overflow-x-hidden">
    <div id="app">
        <div class="flex flex-col items-center justify-center h-screen bg-primary gap-4">
            <div class="w-10 h-10 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
            <p class="text-white/90 font-semibold">Krystaa</p>
        </div>
    </div>

    <script>
        // ============================================================
        // Session data from server
        // ============================================================
        const SESSION = {
            user: "{{ user }}",
            userEmail: "{{ user_email }}",
            roles: {{ roles | tojson }},
            csrf: "{{ csrf_token }}",
            fullName: "{{ full_name or user }}"
        };

        // Shared drawer state
        window._appState = { drawerOpen: false, notifications: [], installPromptEvent: null, showInstallPrompt: false };

        // Capture install prompt event for later use
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window._appState.installPromptEvent = e;
            window._appState.showInstallPrompt = true;
        });

        {% raw %}
        // ============================================================
        // API Helper
        // ============================================================
        const api = {
            get: async (url) => {
                const r = await fetch(url, { credentials: "include" });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const data = await r.json();
                if (data && data.exc) throw new Error(typeof data.exc === 'string' ? data.exc : 'API error');
                return data;
            },
            post: async (url, data) => {
                const r = await fetch(url, {
                    method: "POST", credentials: "include",
                    headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": SESSION.csrf },
                    body: JSON.stringify(data)
                });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const json = await r.json();
                if (json && json.exc) throw new Error(typeof json.exc === 'string' ? json.exc : 'API error');
                return json;
            },
            put: async (url, data) => {
                const r = await fetch(url, {
                    method: "PUT", credentials: "include",
                    headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": SESSION.csrf },
                    body: JSON.stringify(data)
                });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            },
            resource: (dt) => ({
                list: (filters, fields, limit=20) => {
                    let q = `/api/resource/${dt}?limit_page_length=${limit}&limit_start=0`;
                    if (filters) q += `&filters=${encodeURIComponent(JSON.stringify(filters))}`;
                    if (fields) q += `&fields=${encodeURIComponent(JSON.stringify(fields))}`;
                    return api.get(q);
                },
                get: (name) => api.get(`/api/resource/${dt}/${name}`),
                create: (data) => api.post(`/api/resource/${dt}`, data),
                update: (name, data) => api.put(`/api/resource/${dt}/${name}`, data),
            }),
            method: (method, args) => api.post(`/api/method/${method}`, args || {}),
            upload: async (method, formData) => {
                const r = await fetch(`/api/method/${method}`, {
                    method: "POST", credentials: "include",
                    headers: { "X-Frappe-CSRF-Token": SESSION.csrf },
                    body: formData
                });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const json = await r.json();
                if (json && json.exc) throw new Error(typeof json.exc === 'string' ? json.exc : 'API error');
                return json;
            },
        };

        // ============================================================
        // Role helpers
        // ============================================================
        const hasRole = (...roles) => roles.some(r => SESSION.roles.includes(r));
        const isRMA = () => hasRole("RMA Staff", "RMA Manager", "System Manager");
        const isDispatch = () => hasRole("Dispatch User", "Dispatch Operator", "Dispatch Manager", "System Manager");
        const isHR = () => hasRole("HR User", "HR Manager", "System Manager");
        const isManager = () => hasRole("RMA Manager", "Dispatch Manager", "HR Manager", "System Manager");

        // ============================================================
        // Toast system
        // ============================================================
        const toasts = Vue.reactive([]);
        function toast(msg, type="info", duration=3000) {
            const id = Date.now() + Math.random();
            toasts.push({ id, msg, type });
            setTimeout(() => { const idx = toasts.findIndex(t => t.id === id); if (idx > -1) toasts.splice(idx, 1); }, duration);
        }

        // ============================================================
        // Animation support detection
        // ============================================================
        const supportsAnimations = window.matchMedia('(prefers-reduced-motion: no-preference)').matches;

        // ============================================================
        // Vue App
        // ============================================================
        const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, nextTick } = Vue;
        const { createRouter, createWebHistory } = VueRouter;

        // ============================================================
        // COMPONENTS
        // ============================================================

        // --- Dashboard ---
            const Dashboard = {
            template: `
                <div>
                    <section class="relative h-[30vh] min-h-[240px] bg-primary flex flex-col items-center justify-center text-center px-4 overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-primary via-primary to-primary-container"></div>
                        <div class="absolute -top-10 -left-10 w-64 h-64 bg-white/5 rounded-full blur-3xl"></div>
                        <!-- Seamless overlay menu button - triggers root drawer -->
                        <div class="absolute top-0 left-0 right-0 flex justify-between items-center px-4 pt-4 z-20">
                            <button @click="toggleDrawer" class="w-10 h-10 flex items-center justify-center bg-white/15 backdrop-blur-md rounded-full text-white active:scale-95 transition-all">
                                <span class="material-symbols-outlined">menu</span>
                            </button>
                            <div class="flex items-center gap-2 bg-white/15 backdrop-blur-md pl-3 pr-2 py-1.5 rounded-full">
                                <span class="text-white text-label-sm font-medium">{{ displayName }}</span>
                                <div class="w-7 h-7 rounded-full overflow-hidden border border-white/30 bg-white/20 flex items-center justify-center text-white text-label-sm font-bold">{{ displayInitial }}</div>
                            </div>
                        </div>
                        <div class="relative z-10 flex flex-col items-center -mt-4">
                            <div v-if="loading" class="flex flex-col items-center gap-3">
                                <div class="w-16 h-16 rounded-full bg-white/10 animate-pulse"></div>
                                <div class="h-6 w-40 bg-white/20 rounded-full animate-pulse"></div>
                                <div class="h-4 w-32 bg-white/10 rounded-full animate-pulse"></div>
                            </div>
                            <template v-else>
                                <div class="w-16 h-16 rounded-full bg-white/10 backdrop-blur-lg flex items-center justify-center text-white mb-3" :class="attStatus.checked_in ? 'animate-pulse-soft' : ''">
                                    <span class="material-symbols-outlined text-[32px]" :style="attStatus.checked_in ? 'font-variation-settings: FILL 1' : ''">{{ attStatus.checked_in ? 'timer' : 'history_toggle_off' }}</span>
                                </div>
                                <h2 class="text-white text-[28px] font-bold tracking-tight">{{ attStatus.checked_in ? 'Checked In' : 'Not Checked In' }}</h2>
                                <p v-if="attStatus.checked_in" class="text-white/80 text-label-sm mt-1">Started at {{ attStatus.last_checkin || '--' }}</p>
                                <p class="text-white/70 text-body-sm mt-1 flex items-center gap-2">
                                    <span class="w-2 h-2 rounded-full" :class="attStatus.checked_in ? 'bg-green-600 animate-pulse' : 'bg-white/40'"></span>
                                    {{ attStatus.checked_in ? 'Online - Shift Active' : 'Offline - Awaiting Punch' }}
                                </p>
                            </template>
                        </div>
                    </section>

                    <div class="px-4 -mt-12 relative z-20 space-y-4">
                        <div class="bg-surface-container-lowest p-6 rounded-[28px] soft-shadow border border-outline-variant/10 flex flex-col items-center gap-4 cursor-pointer active:scale-[0.98] transition-all duration-200" :class="animClass('animate-fade-in-scale')">
                            <div class="w-full flex justify-between items-center px-1">
                                <span class="text-label-sm text-outline font-medium">{{ loading ? 'Loading...' : (attStatus.checked_in ? 'Shift in Progress' : 'Daily Attendance') }}</span>
                                <span class="text-label-sm text-primary font-bold">{{ todayStr }}</span>
                            </div>
                            <button v-if="!attStatus.checked_in" @click="checkIn" :disabled="attLoading || loading" class="w-20 h-20 rounded-full bg-primary flex items-center justify-center text-white shadow-xl shadow-primary/20 ring-4 ring-primary/10 active:scale-90 transition-all duration-200">
                                <span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'wght' 600">login</span>
                            </button>
                            <button v-else @click="checkOut" :disabled="attLoading || loading" class="w-32 h-32 rounded-full bg-red-600 text-white flex flex-col items-center justify-center gap-1 shadow-lg shadow-red-600/30 active:scale-90 transition-all duration-200">
                                <span class="material-symbols-outlined text-[32px]">logout</span>
                                <span class="text-label-md font-bold">End Shift</span>
                            </button>
                            <div class="text-center">
                                <h3 class="text-headline-md font-bold text-on-surface">{{ loading ? '--' : (attStatus.checked_in ? 'End Shift' : 'Start Shift') }}</h3>
                                <p class="text-label-sm text-outline mt-0.5">{{ attLoading ? 'Processing...' : (loading ? '' : 'Tap to record ' + (attStatus.checked_in ? 'exit' : 'entry')) }}</p>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-headline-md text-on-surface">Shortcuts</h3>
                                <router-link to="/all" class="text-primary text-label-md font-bold active:scale-95 transition-all">View All</router-link>
                            </div>
                            <div v-if="loading" class="grid grid-cols-2 gap-4">
                                <div v-for="i in 4" :key="i" class="bg-white/70 p-4 rounded-2xl border border-white/50 soft-shadow">
                                    <div class="w-10 h-10 rounded-xl bg-surface-container-low animate-pulse mb-3"></div>
                                    <div class="h-4 w-24 bg-surface-container-low rounded-full animate-pulse"></div>
                                </div>
                            </div>
                            <div v-else class="grid grid-cols-2 gap-4">
                                <div v-for="(s, i) in shortcuts" :key="s.route" @click="$router.push(s.route)" class="bg-white/70 backdrop-blur-md p-4 rounded-2xl border border-white/50 soft-shadow flex flex-col items-start gap-3 cursor-pointer active:scale-[0.96] transition-all duration-200 hover:-translate-y-1" :class="animClass('animate-fade-in-up delay-' + ((i % 6) * 50 + 100))">
                                    <div class="w-10 h-10 rounded-xl flex items-center justify-center" :class="s.icon_bg">
                                        <span class="material-symbols-outlined text-[20px]" :class="s.icon_color">{{ s.icon }}</span>
                                    </div>
                                    <span class="text-label-md font-bold text-on-surface">{{ s.label }}</span>
                                </div>
                            </div>
                        </div>

                        <div class="pb-10" :class="animClass('animate-fade-in-up delay-350')">
                            <h3 class="text-headline-md text-on-surface mb-4">Recent Activity</h3>
                            <div v-if="loading">
                                <div v-for="i in 3" :key="i" class="flex items-center gap-4 p-4 mb-3 bg-surface-container-lowest rounded-2xl border border-outline-variant/10 soft-shadow">
                                    <div class="w-10 h-10 rounded-full bg-surface-container-low animate-pulse"></div>
                                    <div class="flex-1"><div class="h-4 w-32 bg-surface-container-low rounded-full animate-pulse mb-2"></div><div class="h-3 w-24 bg-surface-container-low rounded-full animate-pulse"></div></div>
                                    <div class="text-right"><div class="h-3 w-16 bg-surface-container-low rounded-full animate-pulse"></div></div>
                                </div>
                            </div>
                            <div v-else-if="activities.length" class="space-y-3">
                                <div v-for="a in activities" :key="a.title + a.time" @click="$router.push(a.route)" class="flex items-center gap-4 p-4 bg-surface-container-lowest rounded-2xl border border-outline-variant/10 soft-shadow cursor-pointer active:scale-[0.98] transition-all duration-200">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center" :class="'bg-' + a.icon_color + '-100 text-' + a.icon_color + '-600'">
                                        <span class="material-symbols-outlined text-[20px]">{{ a.icon }}</span>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-label-md font-bold text-on-surface truncate">{{ a.title }}</p>
                                        <p class="text-label-sm text-outline truncate">{{ a.subtitle }}</p>
                                    </div>
                                    <div class="text-right flex-shrink-0">
                                        <p class="text-label-sm font-bold text-primary">{{ a.time }}</p>
                                        <p class="text-[10px] text-outline">{{ a.date }}</p>
                                    </div>
                                </div>
                            </div>
                            <div v-else class="flex flex-col items-center justify-center p-8 border border-dashed border-outline-variant/50 rounded-2xl bg-surface-container-low/50">
                                <div class="w-12 h-12 rounded-full bg-outline-variant/20 flex items-center justify-center text-outline/40 mb-3">
                                    <span class="material-symbols-outlined">notifications_off</span>
                                </div>
                                <p class="text-body-md text-outline font-medium">No recent logs</p>
                                <p class="text-label-sm text-outline/60 mt-1">Activity logs will appear here</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const loading = ref(true);
                const attStatus = reactive({ checked_in: false, last_checkin: null, logs: [] });
                const attLoading = ref(false);
                const shortcuts = ref([]);
                const activities = ref([]);
                const todayStr = ref('');
                const displayName = ref(SESSION.fullName || SESSION.user);
                const displayInitial = computed(() => (displayName.value || '?')[0].toUpperCase());

                function toggleDrawer() { if (window._appState) window._appState.drawerOpen = !window._appState.drawerOpen; }

                function animClass(cls) { return supportsAnimations ? cls : ''; }

                function updateDate() {
                    todayStr.value = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                }

                async function loadDashboard() {
                    loading.value = true;
                    try {
                        const [configRes, statsRes, actRes] = await Promise.allSettled([
                            api.method('pwa_app.api.dashboard.get_dashboard_config'),
                            api.method('pwa_app.api.dashboard.get_dashboard_stats'),
                            api.method('pwa_app.api.dashboard.get_recent_activity'),
                        ]);
                        if (configRes.status === 'fulfilled') shortcuts.value = configRes.value.message?.shortcuts || [];
                        if (statsRes.status === 'fulfilled') {
                            const att = statsRes.value.message?.attendance || {};
                            attStatus.checked_in = att.checked_in;
                            attStatus.last_checkin = att.last_checkin;
                            attStatus.logs = att.today_logs || [];
                        }
                        if (actRes.status === 'fulfilled') activities.value = actRes.value.message || [];
                    } catch (e) { console.error('Dashboard load error:', e); }
                    finally { loading.value = false; }
                }

                async function checkIn() {
                    attLoading.value = true;
                    try {
                        await api.method('pwa_app.api.attendance.check_in');
                        toast('Checked in successfully!', 'success');
                        await loadDashboard();
                    } catch (e) { toast('Check-in failed: ' + (e.message || 'Unknown'), 'error'); }
                    finally { attLoading.value = false; }
                }

                async function checkOut() {
                    attLoading.value = true;
                    try {
                        await api.method('pwa_app.api.attendance.check_out');
                        toast('Checked out successfully!', 'success');
                        await loadDashboard();
                    } catch (e) { toast('Check-out failed: ' + (e.message || 'Unknown'), 'error'); }
                    finally { attLoading.value = false; }
                }

                onMounted(() => { updateDate(); loadDashboard(); });
                return { loading, attStatus, attLoading, shortcuts, activities, todayStr, displayName, displayInitial, toggleDrawer, checkIn, checkOut, animClass };
            }
        };

        // --- Attendance (redesigned to match Attendece design) ---
        const Attendance = {
            template: `
                <div class="bg-background min-h-screen relative">
                    <button @click="toggleDrawer" class="fixed top-2 left-2 z-40 w-9 h-9 flex items-center justify-center bg-white/80 backdrop-blur-sm rounded-full text-on-surface shadow-sm active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-[20px]">menu</span>
                    </button>

                    <main class="pt-4 pb-24 px-margin-safe space-y-6 max-w-lg mx-auto">
                        <!-- Loading state -->
                        <template v-if="loading">
                            <div class="h-14 bg-surface-container-low rounded-xl animate-pulse mt-4"></div>
                            <div class="grid grid-cols-1 gap-gutter">
                                <div v-for="i in 2" :key="i" class="h-16 bg-surface-container-low rounded-xl animate-pulse"></div>
                            </div>
                            <div class="h-10 bg-surface-container-low rounded-full animate-pulse w-3/4 mx-auto"></div>
                            <div v-for="i in 3" :key="i" class="h-20 bg-surface-container-low rounded-xl animate-pulse"></div>
                        </template>
                        <template v-else>
                            <!-- Check In/Out Button - hidden for biometric-only -->
                            <section v-if="attType !== 'Biometric'" class="mt-4">
                                <button @click="status.checked_in ? checkOut() : checkIn()" :disabled="attLoading"
                                    class="w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 shadow-md active:scale-95 transition-transform"
                                    :class="status.checked_in ? 'bg-red-500 text-white' : 'bg-primary text-white'">
                                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">{{ status.checked_in ? 'logout' : 'login' }}</span>
                                    <span class="text-body-lg">{{ attLoading ? 'Processing...' : (status.checked_in ? 'Check Out' : 'Check In') }}</span>
                                </button>
                                <p v-if="status.checked_in && status.last_checkin" class="text-center text-label-sm text-outline mt-2">Checked in at {{ status.last_checkin }}</p>
                            </section>

                            <!-- Attendance type notice for biometric-only users -->
                            <div v-if="attType === 'Biometric'" class="bg-orange-50 border border-orange-200 text-orange-700 p-4 rounded-xl text-label-sm">
                                <span class="font-bold">Biometric Attendance</span> &mdash; Your attendance is tracked via biometric devices. Use the designated terminal to punch in/out.
                            </div>

                            <!-- Selfie Capture Modal -->
                            <div v-if="showSelfieModal" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
                                <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl soft-shadow">
                                    <h3 class="text-headline-md font-bold text-on-surface mb-2">Verify Check-in</h3>
                                    <p class="text-label-md text-outline mb-4">Take a selfie to confirm your attendance.</p>
                                    <div v-if="!selfieImage" class="border-2 border-dashed border-outline-variant/30 rounded-xl p-8 text-center">
                                        <label class="cursor-pointer flex flex-col items-center gap-2">
                                            <span class="material-symbols-outlined text-[48px] text-outline">add_a_photo</span>
                                            <span class="text-label-md text-primary font-bold">Tap to capture selfie</span>
                                            <input type="file" accept="image/*" capture="user" @change="onSelfieFile" class="hidden">
                                        </label>
                                    </div>
                                    <div v-else class="space-y-3">
                                        <img :src="selfieImage" class="w-full h-64 object-cover rounded-xl">
                                        <div class="flex gap-2">
                                            <button @click="retakeSelfie" class="flex-1 py-3 rounded-xl bg-surface-container-high text-on-surface text-label-md font-bold">Retake</button>
                                            <button @click="uploadSelfie" :disabled="selfieUploading" class="flex-1 py-3 rounded-xl bg-primary text-white text-label-md font-bold">{{ selfieUploading ? 'Uploading...' : 'Confirm & Save' }}</button>
                                        </div>
                                        <button @click="skipSelfie" class="w-full py-2 text-outline text-label-sm">Skip for now</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Quick Actions -->
                            <section class="grid grid-cols-1 gap-gutter">
                                <router-link to="/expenses" class="bg-surface-container-lowest p-md rounded-xl flex items-center justify-between border border-outline-variant pill-shadow hover:bg-surface-container-low transition-colors">
                                    <div class="flex items-center gap-sm">
                                        <div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center text-primary">
                                            <span class="material-symbols-outlined">payments</span>
                                        </div>
                                        <span class="font-body-lg text-body-lg">Claim an Expense</span>
                                    </div>
                                    <span class="material-symbols-outlined text-outline">chevron_right</span>
                                </router-link>
                                <router-link to="/leaves" class="bg-surface-container-lowest p-md rounded-xl flex items-center justify-between border border-outline-variant pill-shadow hover:bg-surface-container-low transition-colors">
                                    <div class="flex items-center gap-sm">
                                        <div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center text-primary">
                                            <span class="material-symbols-outlined">description</span>
                                        </div>
                                        <span class="font-body-lg text-body-lg">Apply for Leave</span>
                                    </div>
                                    <span class="material-symbols-outlined text-outline">chevron_right</span>
                                </router-link>
                                <button @click="showAdvanceForm = !showAdvanceForm" class="bg-surface-container-lowest p-md rounded-xl flex items-center justify-between border border-outline-variant pill-shadow hover:bg-surface-container-low transition-colors text-left w-full">
                                    <div class="flex items-center gap-sm">
                                        <div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center text-purple-600">
                                            <span class="material-symbols-outlined">account_balance_wallet</span>
                                        </div>
                                        <span class="font-body-lg text-body-lg">Request an Advance</span>
                                    </div>
                                    <span class="material-symbols-outlined text-outline">chevron_right</span>
                                </button>
                                <router-link to="/checkin-logs" class="bg-surface-container-lowest p-md rounded-xl flex items-center justify-between border border-outline-variant pill-shadow hover:bg-surface-container-low transition-colors">
                                    <div class="flex items-center gap-sm">
                                        <div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center text-blue-600">
                                            <span class="material-symbols-outlined">history</span>
                                        </div>
                                        <span class="font-body-lg text-body-lg">View Check-in Logs</span>
                                    </div>
                                    <span class="material-symbols-outlined text-outline">chevron_right</span>
                                </router-link>
                            </section>

                            <!-- Advance form -->
                            <div v-if="showAdvanceForm" class="bg-surface-container-lowest p-5 rounded-2xl border border-outline-variant/10 soft-shadow space-y-3">
                                <h3 class="text-label-md font-bold text-on-surface">Request Employee Advance</h3>
                                <input type="number" v-model="advanceForm.amount" class="w-full p-3 rounded-xl border border-outline-variant/30 bg-white text-on-surface" placeholder="Amount" min="1">
                                <input type="number" v-model="advanceForm.repayment_months" class="w-full p-3 rounded-xl border border-outline-variant/30 bg-white text-on-surface" placeholder="Repayment months" min="1" max="24">
                                <textarea v-model="advanceForm.purpose" class="w-full p-3 rounded-xl border border-outline-variant/30 bg-white text-on-surface" rows="2" placeholder="Purpose"></textarea>
                                <button @click="submitAdvance" :disabled="advSubmitting" class="w-full py-3 rounded-xl bg-primary text-white text-label-md font-bold active:scale-[0.98] transition-all">{{ advSubmitting ? 'Submitting...' : 'Submit Advance Request' }}</button>
                            </div>

                            <!-- Team Request detail overlay -->
                            <div v-if="selectedTeamReq" class="fixed inset-0 z-50 bg-white overflow-y-auto">
                                <div class="sticky top-0 bg-white/95 backdrop-blur-md p-4 border-b border-outline-variant/10 flex items-center gap-3">
                                    <button @click="selectedTeamReq = null" class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center shrink-0">
                                        <span class="material-symbols-outlined">close</span>
                                    </button>
                                    <h3 class="text-label-md font-bold text-on-surface flex-1 truncate">Request Detail</h3>
                                </div>
                                <div class="p-4 space-y-4">
                                    <div class="flex items-center gap-3">
                                        <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0" :class="reqIconBg(selectedTeamReq.type)">
                                            <span class="material-symbols-outlined text-[24px]">{{ reqIcon(selectedTeamReq.type) }}</span>
                                        </div>
                                        <div>
                                            <h2 class="text-headline-md font-bold text-on-surface">{{ selectedTeamReq.title }}</h2>
                                            <p class="text-label-sm text-outline">{{ selectedTeamReq.type }} &middot; {{ selectedTeamReq.date }}</p>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div class="bg-surface-container-low p-3 rounded-xl"><p class="text-label-sm text-outline">Status</p><p class="text-label-md font-bold text-on-surface mt-1" :class="selectedTeamReq.status === 'Approved' ? 'text-green-600' : selectedTeamReq.status === 'Rejected' ? 'text-red-600' : 'text-yellow-600'">{{ selectedTeamReq.status }}</p></div>
                                        <div class="bg-surface-container-low p-3 rounded-xl"><p class="text-label-sm text-outline">Employee</p><p class="text-label-md font-bold text-on-surface mt-1">{{ selectedTeamReq.employee_name }}</p></div>
                                        <div class="bg-surface-container-low p-3 rounded-xl"><p class="text-label-sm text-outline">Doc Name</p><p class="text-label-md font-bold text-on-surface mt-1">{{ selectedTeamReq.name }}</p></div>
                                        <div class="bg-surface-container-low p-3 rounded-xl"><p class="text-label-sm text-outline">Type</p><p class="text-label-md font-bold text-on-surface mt-1">{{ selectedTeamReq.type }}</p></div>
                                    </div>
                                    <div v-if="selectedTeamReq.can_approve && (selectedTeamReq.status === 'Draft' || selectedTeamReq.status === 'Submitted' || selectedTeamReq.status === 'Open')" class="flex gap-3 pt-2">
                                        <button @click="handleApprove(selectedTeamReq); selectedTeamReq = null" :disabled="actionLoading" class="flex-1 py-3 rounded-xl bg-green-600 text-white text-label-md font-bold active:scale-95 transition-all">{{ actionLoading ? 'Processing...' : 'Approve' }}</button>
                                        <button @click="handleReject(selectedTeamReq); selectedTeamReq = null" :disabled="actionLoading" class="flex-1 py-3 rounded-xl bg-red-600 text-white text-label-md font-bold active:scale-95 transition-all">{{ actionLoading ? 'Processing...' : 'Reject' }}</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Request Tabs: My Requests / Team Requests -->
                            <section>
                                <div class="bg-surface-container p-1 rounded-full flex items-center">
                                    <button @click="activeTab = 'my'" class="flex-1 py-2 rounded-full font-label-md text-label-md transition-all" :class="activeTab === 'my' ? 'bg-surface-container-lowest text-on-surface font-semibold shadow-sm' : 'bg-transparent text-outline'">
                                        My Requests
                                    </button>
                                    <button v-if="isHR" @click="activeTab = 'team'" class="flex-1 py-2 rounded-full font-label-md text-label-md transition-all" :class="activeTab === 'team' ? 'bg-surface-container-lowest text-on-surface font-semibold shadow-sm' : 'bg-transparent text-outline'">
                                        Team Requests
                                    </button>
                                </div>
                            </section>

                            <!-- Request List -->
                            <section class="space-y-gutter">
                                <template v-if="activeTab === 'my'">
                                    <div v-if="myRequests.length" class="space-y-gutter">
                                        <div v-for="r in myRequests" :key="r.name" class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant pill-shadow flex items-center gap-sm cursor-pointer hover:bg-surface-container-low transition-all">
                                            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" :class="reqIconBg(r.type)">
                                                <span class="material-symbols-outlined">{{ reqIcon(r.type) }}</span>
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <div class="flex justify-between items-start">
                                                    <h3 class="font-body-lg text-body-lg font-bold truncate">{{ r.title }}</h3>
                                                    <span class="px-2 py-0.5 rounded-full text-label-sm font-bold whitespace-nowrap ml-2" :class="reqBadge(r.status)">{{ r.status }}</span>
                                                </div>
                                                <p class="text-outline text-label-md mt-0.5">{{ r.type }} · {{ r.date }}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div v-else class="flex flex-col items-center justify-center py-10 text-outline">
                                        <span class="material-symbols-outlined text-[48px] text-outline/40 mb-2">description</span>
                                        <p class="text-label-sm">No requests yet</p>
                                    </div>
                                </template>
                                <template v-else>
                                    <div v-if="displayTeamRequests.length" class="space-y-gutter">
                                        <div v-for="r in displayTeamRequests" :key="r.name" @click="selectedTeamReq = r" class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant pill-shadow cursor-pointer hover:bg-surface-container-low transition-all">
                                            <div class="flex items-center gap-sm">
                                                <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" :class="reqIconBg(r.type)">
                                                    <span class="material-symbols-outlined">{{ reqIcon(r.type) }}</span>
                                                </div>
                                                <div class="flex-1 min-w-0">
                                                    <div class="flex justify-between items-start">
                                                        <h3 class="font-body-lg text-body-lg font-bold truncate">{{ r.title }}</h3>
                                                        <span class="px-2 py-0.5 rounded-full text-label-sm font-bold whitespace-nowrap ml-2" :class="reqBadge(r.status)">{{ r.status }}</span>
                                                    </div>
                                                    <p class="text-outline text-label-md mt-0.5">{{ r.employee_name }} · {{ r.type }} · {{ r.date }}</p>
                                                </div>
                                            </div>
                                            <div v-if="r.can_approve && (r.status === 'Draft' || r.status === 'Submitted' || r.status === 'Open')" class="flex gap-2 mt-3 border-t border-outline-variant/10 pt-3" @click.stop>
                                                <button @click="handleApprove(r)" :disabled="actionLoading" class="flex-1 py-2 rounded-lg bg-green-600 text-white text-label-sm font-bold active:scale-95 transition-all">Approve</button>
                                                <button @click="handleReject(r)" :disabled="actionLoading" class="flex-1 py-2 rounded-lg bg-red-600 text-white text-label-sm font-bold active:scale-95 transition-all">Reject</button>
                                            </div>
                                        </div>
                                        <button v-if="teamRequests.length > teamPageSize" @click="teamPageSize += 10" class="w-full py-3 text-primary text-label-md font-bold active:scale-[0.98] transition-all">Load more ({{ teamRequests.length - teamPageSize }} remaining)</button>
                                    </div>
                                    <div v-else class="flex flex-col items-center justify-center py-10 text-outline">
                                        <span class="material-symbols-outlined text-[48px] text-outline/40 mb-2">group_off</span>
                                        <p class="text-label-sm">No pending team requests</p>
                                    </div>
                                </template>
                            </section>
                        </template>
                    </main>
                </div>
            `,
            setup() {
                const loading = ref(true);
                const attLoading = ref(false);
                const activeTab = ref('my');
                const status = reactive({ checked_in: false, logs: [], last_checkin: null });
                const myRequests = ref([]);
                const teamRequests = ref([]);
                const isHR = ref(false);
                const attType = ref(null);
                // Advance form
                const showAdvanceForm = ref(false);
                const advSubmitting = ref(false);
                const advanceForm = reactive({ amount: "", repayment_months: 1, purpose: "" });

                // Selfie capture
                const showSelfieModal = ref(false);
                const selfieImage = ref(null);
                const selfieCheckinName = ref(null);
                const selfieUploading = ref(false);

                // Background location tracking
                let locationInterval = null;

                // Team requests
                const teamPageSize = ref(10);
                const selectedTeamReq = ref(null);
                const actionLoading = ref(false);
                const displayTeamRequests = computed(() => teamRequests.value.slice(0, teamPageSize.value));

                function toggleDrawer() { if (window._appState) window._appState.drawerOpen = !window._appState.drawerOpen; }

                function reqIcon(type) {
                    const m = { "Leave Application": "calendar_today", "Expense Claim": "receipt_long", "Employee Advance": "payments" };
                    return m[type] || "description";
                }
                function reqIconBg(type) {
                    const m = { "Leave Application": "bg-orange-50 text-orange-500", "Expense Claim": "bg-blue-50 text-blue-500", "Employee Advance": "bg-purple-50 text-purple-500" };
                    return m[type] || "bg-surface-container-high text-outline";
                }
                function reqBadge(s) {
                    return { "Draft": "bg-gray-100 text-gray-600", "Applied": "bg-blue-100 text-blue-600", "Submitted": "bg-blue-100 text-blue-600", "Approved": "bg-green-100 text-green-600", "Rejected": "bg-red-100 text-red-600", "Open": "bg-yellow-100 text-yellow-700", "Paid": "bg-green-100 text-green-600" }[s] || "bg-gray-100 text-gray-600";
                }

                function getGeoLocation() {
                    return new Promise((resolve) => {
                        if (!navigator.geolocation) { resolve({}); return; }
                        navigator.geolocation.getCurrentPosition(
                            (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
                            () => resolve({}),
                            { timeout: 5000, enableHighAccuracy: true }
                        );
                    });
                }

                async function loadAll() {
                    loading.value = true;
                    try {
                        const [statusRes, reqRes] = await Promise.allSettled([
                            api.method('pwa_app.api.attendance.get_attendance_status'),
                            api.method('pwa_app.api.attendance.get_requests'),
                        ]);
                        if (statusRes.status === 'fulfilled') {
                            const d = statusRes.value.message || {};
                            status.checked_in = d.checked_in;
                            status.logs = d.logs || [];
                            status.last_checkin = d.last_checkin;
                        }
                        if (reqRes.status === 'fulfilled') {
                            const d = reqRes.value.message || {};
                            myRequests.value = d.my_requests || [];
                            teamRequests.value = d.team_requests || [];
                            isHR.value = teamRequests.value.length > 0;
                        }
                        // Fetch attendance type from employee
                        try {
                            const empRes = await api.resource("Employee").list([["user_id", "=", SESSION.user]], ["name","attendance_type"], 1);
                            if (empRes.data?.length) attType.value = empRes.data[0].attendance_type || 'Biometric';
                        } catch (e) {}
                    } catch (e) { console.error(e); }
                    finally { loading.value = false; }
                }

                async function checkIn() {
                    attLoading.value = true;
                    if (!navigator.onLine) {
                        toast('You are offline. Check-in will be queued.', 'info', 5000);
                        queueOfflineCheckin({ action: 'check_in', time: Date.now() });
                        await loadAll();
                        attLoading.value = false;
                        return;
                    }
                    try {
                        const geo = await getGeoLocation();
                        const res = await api.method('pwa_app.api.attendance.check_in', geo);
                        const data = res.message || {};
                        if (data.warning) toast(data.warning, 'warning', 8000);
                        toast('Checked in!', 'success');
                        await loadAll();
                        if (data.checkin_name) {
                            selfieCheckinName.value = data.checkin_name;
                            showSelfieModal.value = true;
                        }
                        startLocationTracking();
                    } catch (e) { toast('Failed: ' + (e.message || 'Unknown'), 'error'); }
                    finally { attLoading.value = false; }
                }

                function queueOfflineCheckin(item) {
                    try {
                        const queue = JSON.parse(localStorage.getItem('offline_checkin_queue') || '[]');
                        queue.push(item);
                        localStorage.setItem('offline_checkin_queue', JSON.stringify(queue));
                    } catch (e) {}
                }

                async function syncOfflineQueue() {
                    try {
                        const raw = localStorage.getItem('offline_checkin_queue');
                        if (!raw) return;
                        const queue = JSON.parse(raw);
                        if (!queue.length) return;
                        const remaining = [];
                        for (const item of queue) {
                            try {
                                if (item.action === 'check_in') {
                                    await api.method('pwa_app.api.attendance.check_in', {});
                                    toast('Offline check-in synced!', 'success');
                                } else if (item.action === 'check_out') {
                                    await api.method('pwa_app.api.attendance.check_out', {});
                                    toast('Offline check-out synced!', 'success');
                                }
                            } catch (e) {
                                remaining.push(item);
                            }
                        }
                        localStorage.setItem('offline_checkin_queue', JSON.stringify(remaining));
                    } catch (e) {}
                }

                async function checkOut() {
                    attLoading.value = true;
                    if (!navigator.onLine) {
                        toast('You are offline. Check-out will be queued.', 'info', 5000);
                        queueOfflineCheckin({ action: 'check_out', time: Date.now() });
                        await loadAll();
                        attLoading.value = false;
                        return;
                    }
                    try {
                        const geo = await getGeoLocation();
                        await api.method('pwa_app.api.attendance.check_out', geo);
                        toast('Checked out!', 'success');
                        await loadAll();
                        stopLocationTracking();
                    } catch (e) { toast('Failed: ' + (e.message || 'Unknown'), 'error'); }
                    finally { attLoading.value = false; }
                }

                async function uploadSelfie() {
                    if (!selfieImage.value || !selfieCheckinName.value) return;
                    selfieUploading.value = true;
                    try {
                        const blob = await (await fetch(selfieImage.value)).blob();
                        const formData = new FormData();
                        formData.append('file', blob, 'selfie.jpg');
                        formData.append('checkin_name', selfieCheckinName.value);
                        await api.upload('pwa_app.api.attendance.upload_checkin_selfie', formData);
                        toast('Selfie saved!', 'success');
                        showSelfieModal.value = false;
                        selfieImage.value = null;
                    } catch (e) { toast('Selfie failed: ' + (e.message || 'Error'), 'error'); }
                    finally { selfieUploading.value = false; }
                }

                function skipSelfie() {
                    showSelfieModal.value = false;
                    selfieImage.value = null;
                }

                function retakeSelfie() {
                    selfieImage.value = null;
                }

                function onSelfieFile(e) {
                    const file = e.target.files?.[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => { selfieImage.value = ev.target.result; };
                        reader.readAsDataURL(file);
                    }
                }

                function startLocationTracking() {
                    if (locationInterval) clearInterval(locationInterval);
                    if (!navigator.geolocation) return;
                    locationInterval = setInterval(async () => {
                        if (!status.checked_in) { clearInterval(locationInterval); locationInterval = null; return; }
                        navigator.geolocation.getCurrentPosition(async (pos) => {
                            try {
                                await api.method('pwa_app.api.location.update_location', {
                                    latitude: pos.coords.latitude,
                                    longitude: pos.coords.longitude,
                                    accuracy: pos.coords.accuracy,
                                });
                            } catch (e) {}
                        }, () => {}, { timeout: 10000, enableHighAccuracy: false });
                    }, 600000);
                }

                function stopLocationTracking() {
                    if (locationInterval) { clearInterval(locationInterval); locationInterval = null; }
                }

                async function submitAdvance() {
                    if (!advanceForm.amount || parseFloat(advanceForm.amount) < 1) { toast('Enter a valid amount', 'warning'); return; }
                    advSubmitting.value = true;
                    try {
                        await api.method('pwa_app.api.advance.create_advance', {
                            amount: parseFloat(advanceForm.amount),
                            purpose: advanceForm.purpose || '',
                            repayment_months: parseInt(advanceForm.repayment_months) || 1,
                        });
                        toast('Advance request submitted!', 'success');
                        showAdvanceForm.value = false;
                        advanceForm.amount = '';
                        advanceForm.repayment_months = 1;
                        advanceForm.purpose = '';
                        await loadAll();
                    } catch (e) { toast('Failed: ' + (e.message || JSON.stringify(e)), 'error'); }
                    finally { advSubmitting.value = false; }
                }

                async function handleApprove(r) {
                    actionLoading.value = true;
                    try {
                        await api.method('pwa_app.api.attendance.approve_request', { doctype: r.type, name: r.name });
                        toast(r.type + ' approved!', 'success');
                        await loadAll();
                    } catch (e) { toast('Failed: ' + e.message, 'error'); }
                    finally { actionLoading.value = false; }
                }

                async function handleReject(r) {
                    actionLoading.value = true;
                    try {
                        await api.method('pwa_app.api.attendance.reject_request', { doctype: r.type, name: r.name });
                        toast(r.type + ' rejected', 'info');
                        await loadAll();
                    } catch (e) { toast('Failed: ' + e.message, 'error'); }
                    finally { actionLoading.value = false; }
                }

                onMounted(() => {
                    loadAll();
                    window.addEventListener("online", syncOfflineQueue);
                });
                onUnmounted(() => {
                    window.removeEventListener("online", syncOfflineQueue);
                });

            setup() {

                    try {
                        const res = await api.method('pwa_app.api.profile.get_bank_details');
                        const data = res.message || {};
                        Object.assign(bank, data);
                        Object.assign(bankForm, data);

                async function saveBank() {
                    bankSaving.value = true;

                    passError.value = '';

                    if (passForm.new1 !== passForm.new2) { passError.value = 'Passwords do not match'; return; }

        // --- Native Search ---
        const NativeSearch = {
            template: `

                                <input ref="searchInput" v-model="query" @input="debouncedSearch" @keydown.escape="query='';results=[]" class="w-full pl-10 pr-4 py-2.5 rounded-full bg-surface-container-low border-none text-body-md placeholder:text-outline/50 focus:ring-2 focus:ring-primary/30 outline-none" placeholder="Search everything...">
                            </div>

                    </div>
                    <div class="px-4 py-4 space-y-4">

            setup() {

                const loading = ref(false);

                        if (!map[r.doctype]) map[r.doctype] = { doctype: r.doctype, items: [] };
                        map[r.doctype].items.push(r);
                    }
                    return Object.values(map).sort((a, b) => b.items.length - a.items.length);
                });

                let debounceTimer = null;
                function debouncedSearch() {
                    clearTimeout(debounceTimer);
                    if (!query.value || query.value.length < 2) { results.value = []; loading.value = false; return; }
                    loading.value = true;
                    debounceTimer = setTimeout(async () => {
                        try {
                            const res = await api.method('pwa_app.api.search.global_search', { text: query.value, limit: 30 });
                            results.value = res.message || [];

                return { query, loading, results, searchInput, groupedResults, debouncedSearch, openResult, goBack };
            }
        };

        // ============================================================
        // Routes
        // ============================================================
        const routes = [
            { path: "/", redirect: "/dashboard" },
            { path: "/dashboard", component: Dashboard, meta: { title: "Dashboard", bottomNav: true } },

        const AppComponent = {

                                <span class="material-symbols-outlined">notifications</span>

                    </div>

                    <!-- Drawer overlay -->

                            <router-link v-for="item in navItems" :key="item.path" :to="item.path" @click="drawerOpen = false" class="flex items-center gap-4 px-5 py-3 text-on-surface text-body-md font-medium hover:bg-surface-container-low transition-colors" :class="$route.path === item.path ? 'bg-primary/5 text-primary border-l-3 border-primary font-bold' : ''">
                                <span class="material-symbols-outlined text-[22px]">{{ item.icon }}</span> {{ item.label }}
                            </router-link>
                        </nav>
                        <div class="p-4 border-t border-outline-variant/10">
                            <button @click="logout" class="flex items-center gap-3 text-red-600 text-body-md font-medium"><span class="material-symbols-outlined">logout</span> Sign out</button>
                        </div>
                    </div>

                    <!-- Main content -->
                    <main class="pb-20 min-h-screen" :class="showHeader ? 'pt-16' : ''">
                        <router-view />
                    </main>

                    <!-- Bottom Nav -->
                    <nav v-if="showBottomNav" class="fixed bottom-0 left-0 w-full flex justify-around items-center py-3 bg-white/95 backdrop-blur-md border-t border-outline-variant/20 z-50" :class="animClass('animate-slide-up-nav')">
                        <router-link v-for="tab in bottomTabs" :key="tab.route" :to="tab.route" class="flex flex-col items-center justify-center w-1/4 active:scale-95 transition-all duration-200" :class="isActive(tab.route) ? 'text-primary font-bold' : 'text-outline'">
                            <span class="material-symbols-outlined text-[24px]" :style="isActive(tab.route) ? 'font-variation-settings: FILL 1' : ''">{{ tab.icon }}</span>

                        </router-link>
                    </nav>
                </div>
            `,
            setup() {
                const drawerOpen = ref(window._appState?.drawerOpen || false);
                watch(drawerOpen, (v) => { if (window._appState) window._appState.drawerOpen = v; });
                if (window._appState) {
                    watch(() => window._appState.drawerOpen, (v) => { drawerOpen.value = v; });
                }
                const online = ref(navigator.onLine);
                const userFullName = ref(SESSION.fullName || SESSION.user);
                const userInitial = computed(() => (userFullName.value || '?')[0].toUpperCase());
                const primaryRole = computed(() => {
                    const roles = SESSION.roles;
                    if (roles.includes("System Manager")) return "System Manager";
                    if (roles.includes("HR Manager")) return "HR Manager";
                    if (roles.includes("RMA Manager")) return "RMA Manager";
                    if (roles.includes("Dispatch Manager")) return "Dispatch Manager";
                    return roles[0] || "User";
                });

                // Notifications
                const notifOpen = ref(false);
                const notifications = ref([]);
                const notifUnread = ref(0);
                let notifPollTimer = null;

                async function fetchNotifications() {
                    try {
                        const [listRes, countRes] = await Promise.allSettled([
                            api.method('pwa_app.api.notifications.get_notifications'),
                            api.method('pwa_app.api.notifications.get_unread_count'),
                        ]);
                        if (listRes.status === 'fulfilled') notifications.value = listRes.value.message || [];
                        if (countRes.status === 'fulfilled') notifUnread.value = countRes.value.message?.count || 0;
                    } catch (e) {}
                }

                async function markAllNotifRead() {
                    try { await api.method('pwa_app.api.notifications.mark_all_read'); notifications.value.forEach(n => n.read = true); notifUnread.value = 0; toast('All marked read', 'success'); }
                    catch (e) {}
                }

                function openNotif(n) {
                    if (!n.read) {
                        api.method('pwa_app.api.notifications.mark_read', { name: n.name }).catch(() => {});
                        n.read = true;
                        notifUnread.value = Math.max(0, notifUnread.value - 1);
                    }
                    notifOpen.value = false;
                    const route = getRouteForNotif(n);
                    if (route) router.push(route);
                }

                function getRouteForNotif(n) {
                    const map = {
                        "Leave Application": "/leaves",
                        "Expense Claim": "/expenses",
                        "Employee Advance": "/attendance",
                        "Employee Checkin": "/checkin-logs",
                        "Attendance Request": "/leaves",
                        "Shift Request": "/attendance",
                        "Compensatory Leave Request": "/leaves",
                    };
                    return map[n.document_type] || null;
                }

                // Install prompt — captured from beforeinstallprompt event
                const showInstallBanner = ref(true);
                const deferredInstallEvent = ref(null);
                let onBeforeInstall = null;

                function triggerInstall() {
                    const event = deferredInstallEvent.value;
                    if (!event) return;
                    event.prompt();
                    event.userChoice.then((choiceResult) => {
                        deferredInstallEvent.value = null;
                        showInstallBanner.value = false;
                        if (choiceResult.outcome === 'accepted') toast('App installed!', 'success');
                        else toast('Install cancelled', 'info');
                    });
                }

                const showHeader = computed(() => router.currentRoute.value.path !== '/dashboard');
                const showBottomNav = computed(() => router.currentRoute.value.meta?.bottomNav);
                const bottomTabs = [
                    { route: "/dashboard", icon: "home", label: "Home" },
                    { route: "/attendance", icon: "schedule", label: "Attendance" },
                    { route: "/search", icon: "search", label: "Search" },
                    { route: "/profile", icon: "account_circle", label: "Profile" },
                ];

                function isActive(route) { return router.currentRoute.value.path === route; }
                function animClass(cls) { return supportsAnimations ? cls : ''; }

                const navItems = computed(() => [
                    { path: "/dashboard", label: "Dashboard", icon: "dashboard", show: true },
                    { path: "/attendance", label: "Attendance", icon: "schedule", show: true },
                    { path: "/hr-dashboard", label: "HR Dashboard", icon: "badge", show: isHR() },
                    { path: "/leaves", label: "Leaves", icon: "calendar_today", show: true },
                    { path: "/expenses", label: "Expenses", icon: "receipt_long", show: true },
                    { path: "/rma", label: "RMA", icon: "build", show: isRMA() },
                    { path: "/dispatch", label: "Dispatch", icon: "local_shipping", show: isDispatch() },
                    { path: "/items", label: "Items", icon: "inventory_2", show: true },
                    { path: "/directory", label: "Directory", icon: "contacts", show: true },
                    { path: "/checkin-logs", label: "Check-in Logs", icon: "history", show: true },
                    { path: "/customers", label: "Customers", icon: "people", show: true },
                    { path: "/mail", label: "Mail", icon: "mail", show: true },
                    { path: "/comms", label: "Comms", icon: "campaign", show: false },
                ].filter(i => i.show).map(({show, ...rest}) => rest));

                function logout() { api.post("/api/method/logout").then(() => { window.location.href = "/login"; }); }

                // Click outside to close notification dropdown
                const notifDropdownRef = ref(null);
                function handleClickOutside(e) {
                    if (notifOpen.value && notifDropdownRef.value) {
                        const target = e.target;
                        if (!notifDropdownRef.value.contains(target) && !target.closest('.notif-trigger')) {
                            notifOpen.value = false;
                        }
                    }
                }

                function updateOnline() { online.value = navigator.onLine; }
                onMounted(() => {
                    // Capture install prompt (handles both before and after mount)
                    if (window._appState?.installPromptEvent) deferredInstallEvent.value = window._appState.installPromptEvent;
                    onBeforeInstall = (e) => { e.preventDefault(); deferredInstallEvent.value = e; };
                    window.addEventListener('beforeinstallprompt', onBeforeInstall);

                    window.addEventListener("online", updateOnline);
                    window.addEventListener("offline", updateOnline);
                    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/assets/pwa_app/sw.js").catch(() => {});
                    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
                    if ("geolocation" in navigator) navigator.permissions.query({ name: 'geolocation' }).then(r => {
                        if (r.state === 'prompt') toast('Enable GPS for check-in', 'info', 5000);
                    });
                    fetchNotifications();
                    notifPollTimer = setInterval(fetchNotifications, 30000);
                    document.addEventListener('click', handleClickOutside);
                });
                onUnmounted(() => {
                    window.removeEventListener("online", updateOnline);
                    window.removeEventListener("offline", updateOnline);
                    if (onBeforeInstall) window.removeEventListener('beforeinstallprompt', onBeforeInstall);
                    if (notifPollTimer) clearInterval(notifPollTimer);
                    document.removeEventListener('click', handleClickOutside);
                });

                return { drawerOpen, online, userFullName, userInitial, primaryRole, showHeader, showBottomNav, bottomTabs, isActive, navItems, logout, toasts, animClass, notifOpen, notifDropdownRef, notifications, notifUnread, fetchNotifications, markAllNotifRead, openNotif, showInstallBanner, deferredInstallEvent, triggerInstall };
            }
        };

        // ============================================================
        // Mount with error boundary
        // ============================================================
        const app = createApp(AppComponent);
        app.config.errorHandler = (err, vm, info) => {
            console.error('Vue error:', err, info);
            toast('Something went wrong. Please refresh the page.', 'error', 5000);
        };
        app.use(router);
        app.mount("#app");
        {% endraw %}
    </script>
</body>
</html>
