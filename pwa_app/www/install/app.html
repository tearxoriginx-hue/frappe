<!DOCTYPE html>
<html class="light" lang="en">
<head>

    <link rel="manifest" href="/install/manifest.json">
    <link rel="icon" href="{{ favicon_url }}" sizes="any">
    <link rel="apple-touch-icon" href="/assets/pwa_app/icons/icon-192.svg">

                        "secondary-fixed": "#d3e4fe", "primary-fixed-dim": "#b4c5ff",
                        "background": "#f7f9fb", "primary": "#004ac6",
                        "on-surface-variant": "#434655", "tertiary-container": "#656d84",
                        "surface-variant": "#e0e3e5", "outline-variant": "#c3c6d7",
                        "on-tertiary-container": "#eef0ff", "surface-tint": "#0053db",
                        "surface-container-high": "#e6e8ea", "secondary": "#505f76",
                        "surface-dim": "#d8dadc", "on-primary": "#ffffff",
                        "primary-container": "#2563eb", "on-tertiary-fixed": "#131b2e",
                        "outline": "#737686", "tertiary-fixed": "#dae2fd",
                        "on-primary-fixed-variant": "#003ea8", "surface-bright": "#f7f9fb",
                        "tertiary": "#4d556b", "primary-fixed": "#dbe1ff",
                        "on-secondary-fixed": "#0b1c30", "on-surface": "#191c1e",
                        "secondary-fixed-dim": "#b7c8e1", "on-secondary-fixed-variant": "#38485d",
                        "secondary-container": "#d0e1fb", "surface-container-highest": "#e0e3e5",
                        "surface-container": "#eceef0", "surface-container-low": "#f2f4f6",
                        "on-error-container": "#93000a", "tertiary-fixed-dim": "#bec6e0",
                        "inverse-primary": "#b4c5ff", "inverse-on-surface": "#eff1f3",
                        "on-background": "#191c1e", "on-primary-container": "#eeefff",
                        "error-container": "#ffdad6", "on-secondary": "#ffffff",
                        "inverse-surface": "#2d3133", "on-primary-fixed": "#00174b",
                        "on-secondary-container": "#54647a", "on-tertiary-fixed-variant": "#3f465c"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": { "margin-mobile": "16px", "margin-desktop": "40px", "margin-safe": "16px", "xs": "4px", "2xl": "48px", "base": "4px", "md": "16px", "gutter": "12px", "xl": "32px", "3xl": "64px", "lg": "24px", "sm": "12px" },
                    "fontFamily": { "headline-md": ["Manrope"], "body-sm": ["Inter"], "label-md": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Manrope"], "body-md": ["Inter"], "body-lg": ["Inter"], "display-lg": ["Manrope"] },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600"}],

                    },
                    "animation": {

                        "fade-in-scale": "fade-in-scale 0.6s ease-out 0.2s forwards",
                        "fade-in-up": "fade-in-up 0.5s ease-out forwards",
                        "slide-up-nav": "slide-up-nav 0.4s ease-out forwards",
                        "pulse-soft": "pulse-soft 2s infinite"
                    },
                    "keyframes": {
                        "slide-down": { "0%": { transform: "translateY(-100%)", opacity: "0" }, "100%": { transform: "translateY(0)", opacity: "1" } },
                        "fade-in-scale": { "0%": { transform: "scale(0.95)", opacity: "0" }, "100%": { transform: "scale(1)", opacity: "1" } },
                        "fade-in-up": { "0%": { transform: "translateY(20px)", opacity: "0" }, "100%": { transform: "translateY(0)", opacity: "1" } },
                        "slide-up-nav": { "0%": { transform: "translateY(100%)" }, "100%": { transform: "translateY(0)" } },
                        "pulse-soft": { "0%, 100%": { boxShadow: "0 0 0 0 rgba(0, 74, 198, 0.4)" }, "50%": { boxShadow: "0 0 0 12px rgba(0, 74, 198, 0)" } }

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; line-height: 1; text-transform: none; letter-spacing: normal; word-wrap: normal; white-space: nowrap; direction: ltr; }
        .soft-shadow { box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.04); }
        body { background-color: #f7f9fb; color: #191c1e; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-marker { background: none !important; border: none !important; }
        .leaflet-popup-content-wrapper { border-radius: 12px !important; font-family: system-ui !important; }
        .leaflet-popup-content { margin: 12px 16px !important; }
        .delay-100 { animation-delay: 0.1s; } .delay-150 { animation-delay: 0.15s; } .delay-200 { animation-delay: 0.2s; }
        .delay-250 { animation-delay: 0.25s; } .delay-300 { animation-delay: 0.3s; } .delay-350 { animation-delay: 0.35s; }
        .pill-shadow { box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05); }
        .px-margin-safe { padding-left: 16px; padding-right: 16px; }
        .gap-sm { gap: 12px; }
        .gap-gutter { gap: 12px; }
        .p-md { padding: 16px; }
        .space-y-gutter > :not([hidden]) ~ :not([hidden]) { --tw-space-y-reverse: 0; margin-top: calc(12px * (1 - var(--tw-space-y-reverse))); margin-bottom: calc(12px * var(--tw-space-y-reverse)); }
    
        .geofence-pulse {
            animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }
    </style>
<script>
    // Capture install prompt early — before any page JS
    window._deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window._deferredInstallPrompt = e;
    });
</script>
</head>
<body class="flex flex-col min-h-screen font-body-md overflow-x-hidden">
{% if is_guest %}
    <div id="guest-app" class="flex items-center justify-center min-h-screen p-8" style="background: #f7f9fb;">
        <div class="text-center max-w-sm">
            {% if app_logo_url %}
            <img src="{{ app_logo_url }}" alt="Logo" class="w-24 h-24 mx-auto mb-6 rounded-2xl shadow-lg object-contain">
            {% endif %}
            <h1 class="text-[32px] font-bold text-[#191c1e] mb-2" style="font-family: Manrope, sans-serif;">{{ app_name }}</h1>
            <button id="guestActionBtn" class="mt-6 w-full px-6 py-4 rounded-2xl text-white text-[14px] font-bold shadow-lg active:scale-95 transition-all" style="background: #004ac6; font-family: Inter, sans-serif;">
                <span class="align-middle mr-2" style="display: inline-block; font-size: 20px; line-height: 1;"></span>
                <span id="guestActionLabel"></span>
            </button>
            <p id="guestActionHint" class="mt-4 text-[13px] text-[#737686]" style="font-family: Inter, sans-serif;"></p>
        </div>
    </div>
    <script>
        (function() {
            var isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
            var btn = document.getElementById('guestActionBtn');
            var label = document.getElementById('guestActionLabel');
            var hint = document.getElementById('guestActionHint');
            var icon = btn.querySelector('.align-middle');

            if (isStandalone) {
                icon.textContent = '🔑';
                label.textContent = 'Login';
                btn.onclick = function() { window.location.href = '/login?redirect-to=/install/app'; };
                hint.textContent = 'Tap to login with your credentials.';
            } else {
                icon.textContent = '📲';
                label.textContent = 'Install App';
                hint.textContent = 'Install the app on your device, then login with your credentials.';
                btn.onclick = function() {
                    var evt = window._deferredInstallPrompt;
                    if (!evt) { hint.textContent = 'Install not supported on this browser. Try opening in Chrome.'; return; }
                    evt.prompt();
                    evt.userChoice.then(function() { window._deferredInstallPrompt = null; });
                };
            }
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/assets/pwa_app/sw.js?v=" + (Date.now())).catch(function() {});
            }
        })();
    </script>
{% else %}
    <div id="app">
        <div class="flex flex-col gap-3 p-4 animate-pulse">
            <div class="h-8 w-3/4 rounded-xl bg-surface-container-low"></div>
            <div class="h-16 rounded-2xl bg-surface-container-low"></div>
            <div class="grid grid-cols-2 gap-3">
                <div class="h-20 rounded-2xl bg-surface-container-low"></div>
                <div class="h-20 rounded-2xl bg-surface-container-low"></div>
            </div>
            <div class="h-12 rounded-xl bg-surface-container-low"></div>
            <div class="h-12 rounded-xl bg-surface-container-low"></div>
            <div class="h-12 rounded-xl bg-surface-container-low"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // Session data from server
        // ============================================================
        const SESSION = {
            user: {{ user | tojson }},
            userEmail: {{ user_email | tojson }},
            roles: {{ roles | tojson }},
            csrf: {{ csrf_token | tojson }},
            fullName: {{ (full_name or user) | tojson }}
        };

        {% raw %}
        // ============================================================
        // API Helper
        // ============================================================
        const api = {
            get: async (url) => {
                const r = await fetch(url, { credentials: "include" });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const data = await r.json();
                if (data && data.exc) throw new Error(typeof data.exc === 'string' ? data.exc : 'API error');
                return data;
            },
            post: async (url, data) => {
                const r = await fetch(url, {
                    method: "POST", credentials: "include",
                    headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": SESSION.csrf },
                    body: JSON.stringify(data)
                });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const json = await r.json();
                if (json && json.exc) throw new Error(typeof json.exc === 'string' ? json.exc : 'API error');
                return json;
            },
            put: async (url, data) => {
                const r = await fetch(url, {
                    method: "PUT", credentials: "include",
                    headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": SESSION.csrf },
                    body: JSON.stringify(data)
                });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            },
            resource: (dt) => ({
                list: (filters, fields, limit=20) => {
                    let q = `/api/resource/${dt}?limit_page_length=${limit}&limit_start=0`;
                    if (filters) q += `&filters=${encodeURIComponent(JSON.stringify(filters))}`;
                    if (fields) q += `&fields=${encodeURIComponent(JSON.stringify(fields))}`;
                    return api.get(q);
                },
                get: (name) => api.get(`/api/resource/${dt}/${name}`),
                create: (data) => api.post(`/api/resource/${dt}`, data),
                update: (name, data) => api.put(`/api/resource/${dt}/${name}`, data),
            }),
            method: (method, args) => api.post(`/api/method/${method}`, args || {}),
            upload: async (method, formData) => {
                const r = await fetch(`/api/method/${method}`, {
                    method: "POST", credentials: "include",
                    headers: { "X-Frappe-CSRF-Token": SESSION.csrf },
                    body: formData
                });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const json = await r.json();
                if (json && json.exc) throw new Error(typeof json.exc === 'string' ? json.exc : 'API error');
                return json;
            },
        };

        // ============================================================
        // Role helpers
        // ============================================================
        const hasRole = (...roles) => roles.some(r => SESSION.roles.includes(r));
        const isRMA = () => hasRole("RMA Staff", "RMA Manager", "System Manager");
        const isDispatch = () => hasRole("Dispatch User", "Dispatch Operator", "Dispatch Manager", "System Manager");
        const isHR = () => hasRole("System Manager", "HR Manager");
        const isManager = () => hasRole("RMA Manager", "Dispatch Manager", "HR Manager", "System Manager");

        // ============================================================
        // Toast system
        // ============================================================
        const toasts = Vue.reactive([]);
        function toast(msg, type="info", duration=3000) {
            const id = Date.now() + Math.random();
            toasts.push({ id, msg, type });
            setTimeout(() => { const idx = toasts.findIndex(t => t.id === id); if (idx > -1) toasts.splice(idx, 1); }, duration);
        }

        // ============================================================
        // Animation support detection
        // ============================================================
        const supportsAnimations = window.matchMedia('(prefers-reduced-motion: no-preference)').matches;

        // ============================================================
        // Vue App
        // ============================================================
        const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, nextTick } = Vue;
        const { createRouter, createWebHistory } = VueRouter;

        // ============================================================
        // COMPONENTS
        // ============================================================

        // --- Dashboard ---
            const Dashboard = {
            template: `
                <div>
                    <section class="relative h-[30vh] min-h-[240px] bg-primary flex flex-col items-center justify-center text-center px-4 overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-primary via-primary to-primary-container"></div>
                        <div class="absolute -top-10 -left-10 w-64 h-64 bg-white/5 rounded-full blur-3xl"></div>
                        <!-- Seamless overlay menu button - triggers root drawer -->
                        <div class="absolute top-0 left-0 right-0 flex justify-between items-center px-4 pt-4 z-20">
                            <button @click="toggleDrawer" class="w-10 h-10 flex items-center justify-center bg-white/15 backdrop-blur-md rounded-full text-white active:scale-95 transition-all">
                                <span class="material-symbols-outlined">menu</span>
                            </button>
                            <div @click="$router.push('/profile')" class="flex items-center gap-2 bg-white/15 backdrop-blur-md pl-3 pr-2 py-1.5 rounded-full cursor-pointer active:scale-95 transition-all">
                                <span class="text-white text-label-sm font-medium">{{ displayName }}</span>
                                <div class="w-7 h-7 rounded-full overflow-hidden border border-white/30 bg-white/20 flex items-center justify-center text-white text-label-sm font-bold">{{ displayInitial }}</div>
                            </div>
                        </div>
                        <div class="relative z-10 flex flex-col items-center -mt-4">
                            <div v-if="loading" class="flex flex-col items-center gap-3">
                                <div class="w-16 h-16 rounded-full bg-white/10 animate-pulse"></div>
                                <div class="h-6 w-40 bg-white/20 rounded-full animate-pulse"></div>
                                <div class="h-4 w-32 bg-white/10 rounded-full animate-pulse"></div>
                            </div>
                            <template v-else>
                                <div class="w-16 h-16 rounded-full bg-white/10 backdrop-blur-lg flex items-center justify-center text-white mb-3" :class="attStatus.checked_in ? 'animate-pulse-soft' : ''">
                                    <span class="material-symbols-outlined text-[32px]" :style="attStatus.checked_in ? 'font-variation-settings: FILL 1' : ''">{{ attStatus.checked_in ? 'timer' : 'history_toggle_off' }}</span>
                                </div>
                                <h2 class="text-white text-[28px] font-bold tracking-tight">{{ attStatus.checked_in ? 'Checked In' : 'Not Checked In' }}</h2>
                                <p v-if="attStatus.checked_in" class="text-white/80 text-label-sm mt-1">Started at {{ attStatus.last_checkin || '--' }}</p>
                                <p class="text-white/70 text-body-sm mt-1 flex items-center gap-2">
                                    <span class="w-2 h-2 rounded-full" :class="attStatus.checked_in ? 'bg-green-600 animate-pulse' : 'bg-white/40'"></span>
                                    {{ attStatus.checked_in ? 'Online - Shift Active' : 'Offline - Awaiting Punch' }}
                                </p>
                            </template>
                        </div>
                    </section>

                    <div class="px-4 -mt-12 relative z-20 space-y-4">
                        <div class="bg-surface-container-lowest p-6 rounded-[28px] soft-shadow border border-outline-variant/10 flex flex-col items-center gap-4 cursor-pointer active:scale-[0.98] transition-all duration-200" :class="animClass('animate-fade-in-scale')">
                            <div class="w-full flex justify-between items-center px-1">
                                <span class="text-label-sm text-outline font-medium">{{ loading ? 'Loading...' : (attStatus.checked_in ? 'Shift in Progress' : 'Daily Attendance') }}</span>
                                <span class="text-label-sm text-primary font-bold">{{ todayStr }}</span>
                            </div>
                            <button v-if="!attStatus.checked_in" @click="checkIn" :disabled="attLoading || loading" class="w-20 h-20 rounded-full bg-primary flex items-center justify-center text-white shadow-xl shadow-primary/20 ring-4 ring-primary/10 active:scale-90 transition-all duration-200">
                                <span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'wght' 600">login</span>
                            </button>
                            <button v-else @click="checkOut" :disabled="attLoading || loading" class="w-32 h-32 rounded-full bg-red-600 text-white flex flex-col items-center justify-center gap-1 shadow-lg shadow-red-600/30 active:scale-90 transition-all duration-200">
                                <span class="material-symbols-outlined text-[32px]">logout</span>
                                <span class="text-label-md font-bold">End Shift</span>
                            </button>
                            <div class="text-center">
                                <h3 class="text-headline-md font-bold text-on-surface">{{ loading ? '--' : (attStatus.checked_in ? 'End Shift' : 'Start Shift') }}</h3>
                                <p class="text-label-sm text-outline mt-0.5">{{ attLoading ? 'Processing...' : (loading ? '' : 'Tap to record ' + (attStatus.checked_in ? 'exit' : 'entry')) }}</p>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-headline-md text-on-surface">Shortcuts</h3>
                                <router-link to="/all" class="text-primary text-label-md font-bold active:scale-95 transition-all">View All</router-link>
                            </div>
                            <div v-if="loading" class="grid grid-cols-2 gap-4">
                                <div v-for="i in 4" :key="i" class="bg-white/70 p-4 rounded-2xl border border-white/50 soft-shadow">
                                    <div class="w-10 h-10 rounded-xl bg-surface-container-low animate-pulse mb-3"></div>
                                    <div class="h-4 w-24 bg-surface-container-low rounded-full animate-pulse"></div>
                                </div>
                            </div>
                            <div v-else class="grid grid-cols-2 gap-4">
                                <div v-for="(s, i) in shortcuts" :key="s.route" @click="$router.push(s.route)" class="bg-white/70 backdrop-blur-md p-4 rounded-2xl border border-white/50 soft-shadow flex flex-col items-start gap-3 cursor-pointer active:scale-[0.96] transition-all duration-200 hover:-translate-y-1" :class="animClass('animate-fade-in-up delay-' + ((i % 6) * 50 + 100))">
                                    <div class="w-10 h-10 rounded-xl flex items-center justify-center" :class="s.icon_bg">
                                        <span class="material-symbols-outlined text-[20px]" :class="s.icon_color">{{ s.icon }}</span>
                                    </div>
                                    <span class="text-label-md font-bold text-on-surface">{{ s.label }}</span>
                                </div>
                            </div>
                        </div>

                        <div class="pb-10" :class="animClass('animate-fade-in-up delay-350')">
                            <h3 class="text-headline-md text-on-surface mb-4">Recent Activity</h3>
                            <div v-if="loading">
                                <div v-for="i in 3" :key="i" class="flex items-center gap-4 p-4 mb-3 bg-surface-container-lowest rounded-2xl border border-outline-variant/10 soft-shadow">
                                    <div class="w-10 h-10 rounded-full bg-surface-container-low animate-pulse"></div>
                                    <div class="flex-1"><div class="h-4 w-32 bg-surface-container-low rounded-full animate-pulse mb-2"></div><div class="h-3 w-24 bg-surface-container-low rounded-full animate-pulse"></div></div>
                                    <div class="text-right"><div class="h-3 w-16 bg-surface-container-low rounded-full animate-pulse"></div></div>
                                </div>
                            </div>
                            <div v-else-if="activities.length" class="space-y-3">
                                <div v-for="a in activities" :key="a.title + a.time" @click="$router.push(a.route)" class="flex items-center gap-4 p-4 bg-surface-container-lowest rounded-2xl border border-outline-variant/10 soft-shadow cursor-pointer active:scale-[0.98] transition-all duration-200">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center" :class="'bg-' + a.icon_color + '-100 text-' + a.icon_color + '-600'">
                                        <span class="material-symbols-outlined text-[20px]">{{ a.icon }}</span>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-label-md font-bold text-on-surface truncate">{{ a.title }}</p>
                                        <p class="text-label-sm text-outline truncate">{{ a.subtitle }}</p>
                                    </div>
                                    <div class="text-right flex-shrink-0">
                                        <p class="text-label-sm font-bold text-primary">{{ a.time }}</p>
                                        <p class="text-[10px] text-outline">{{ a.date }}</p>
                                    </div>
                                </div>
                            </div>
                            <div v-else class="flex flex-col items-center justify-center p-8 border border-dashed border-outline-variant/50 rounded-2xl bg-surface-container-low/50">
                                <div class="w-12 h-12 rounded-full bg-outline-variant/20 flex items-center justify-center text-outline/40 mb-3">
                                    <span class="material-symbols-outlined">notifications_off</span>
                                </div>
                                <p class="text-body-md text-outline font-medium">No recent logs</p>
                                <p class="text-label-sm text-outline/60 mt-1">Activity logs will appear here</p>
                            </div>
                        </div>
                    </div>
                </div>

                            api.method('pwa_app.api.dashboard.get_recent_activity'),

                        if (statsRes.status === 'fulfilled') {

                            attStatus.checked_in = att.checked_in;
                            attStatus.last_checkin = att.last_checkin;
                            attStatus.logs = att.today_logs || [];
                        }
                        if (actRes.status === 'fulfilled') activities.value = actRes.value.message || [];

                    finally { loading.value = false; }

                                        <p class="text-label-sm">No pending team requests</p>
                                    </div>
                                </template>
                            </section>
                        </template>
                    </main>
                </div>
            `,
            setup() {
                const loading = ref(true);
                const attLoading = ref(false);
                const activeTab = ref('my');
                const status = reactive({ checked_in: false, logs: [], last_checkin: null });
                const myRequests = ref([]);
                const teamRequests = ref([]);
                const isHR = ref(false);
                const attType = ref(null);
                const userInitial = computed(() => (SESSION.full_name || SESSION.user || '?')[0].toUpperCase());
                // Advance form
                const showAdvanceOverlay = ref(false);
                const advanceForm = reactive({ amount: "", repayment_months: 1, purpose: "" });
                const advSuccess = ref(false);
                const advSubmitting = ref(false);
                const monthlyDeduction = ref("0.00");
                const repaymentMonths = ref(1);
                const firstInstallment = ref("");


                function calcRepayment() {
                    const amount = parseFloat(advanceForm.amount) || 0;
                    const months = parseInt(advanceForm.repayment_months) || 1;
                    repaymentMonths.value = months;
                    monthlyDeduction.value = (amount / months).toFixed(2);
                    const next = new Date();
                    next.setMonth(next.getMonth() + 1);
                    firstInstallment.value = next.toLocaleString('en', { month: 'short', year: 'numeric' });
                }

                function openAdvanceOverlay() {
                    showAdvanceOverlay.value = true;
                    advSuccess.value = false;
                    calcRepayment();
                }

                function closeAdvanceOverlay() {
                    showAdvanceOverlay.value = false;
                    advSuccess.value = false;
                    advanceForm.amount = '';
                    advanceForm.repayment_months = 1;
                    advanceForm.purpose = '';
                }


                // Selfie capture
                const showSelfieModal = ref(false);
                const selfieImage = ref(null);
                const selfieCheckinName = ref(null);
                const selfieUploading = ref(false);

                // Background location tracking
                let locationInterval = null;

                // Team requests
                const teamPageSize = ref(10);
                const selectedTeamReq = ref(null);
                const actionLoading = ref(false);
                const displayTeamRequests = computed(() => teamRequests.value.slice(0, teamPageSize.value));

                function toggleDrawer() { if (window._appState) window._appState.drawerOpen = !window._appState.drawerOpen; }

                function reqIcon(type) {
                    const m = { "Leave Application": "calendar_today", "Expense Claim": "receipt_long", "Employee Advance": "payments" };
                    return m[type] || "description";
                }
                function reqIconBg(type) {
                    const m = { "Leave Application": "bg-orange-50 text-orange-500", "Expense Claim": "bg-blue-50 text-blue-500", "Employee Advance": "bg-purple-50 text-purple-500" };
                    return m[type] || "bg-surface-container-high text-outline";
                }
                function reqBadge(s) {
                    return { "Draft": "bg-gray-100 text-gray-600", "Applied": "bg-blue-100 text-blue-600", "Submitted": "bg-blue-100 text-blue-600", "Approved": "bg-green-100 text-green-600", "Rejected": "bg-red-100 text-red-600", "Open": "bg-yellow-100 text-yellow-700", "Paid": "bg-green-100 text-green-600" }[s] || "bg-gray-100 text-gray-600";
                }

                function getGeoLocation() {
                    return new Promise((resolve) => {
                        if (!navigator.geolocation) { resolve({}); return; }
                        navigator.geolocation.getCurrentPosition(
                            (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
                            () => resolve({}),
                            { timeout: 5000, enableHighAccuracy: true }
                        );
                    });
                }

                async function loadAll() {
                    loading.value = true;
                    try {
                        const [statusRes, reqRes] = await Promise.allSettled([
                            api.method('pwa_app.api.attendance.get_attendance_status'),
                            api.method('pwa_app.api.attendance.get_requests'),
                        ]);
                        if (statusRes.status === 'fulfilled') {
                            const d = statusRes.value.message || {};
                            status.checked_in = d.checked_in;
                            status.logs = d.logs || [];
                            status.last_checkin = d.last_checkin;
                        }
                        if (reqRes.status === 'fulfilled') {
                            const d = reqRes.value.message || {};
                            myRequests.value = d.my_requests || [];
                            teamRequests.value = d.team_requests || [];
                            isHR.value = hasRole("System Manager", "HR Manager");
                        }
                        // Fetch attendance type from employee
                        try {
                            const empRes = await api.resource("Employee").list([["user_id", "=", SESSION.user]], ["name","attendance_type"], 1);
                            if (empRes.data?.length) attType.value = empRes.data[0].attendance_type || 'Biometric';
                        } catch (e) {}
                    } catch (e) { console.error(e); }
                    finally { loading.value = false; }
                }

                async function checkIn() {
                    attLoading.value = true;
                    if (!navigator.onLine) {
                        toast('You are offline. Check-in will be queued.', 'info', 5000);
                        queueOfflineCheckin({ action: 'check_in', time: Date.now() });
                        await loadAll();
                        attLoading.value = false;
                        return;
                    }
                    try {
                        const geo = await getGeoLocation();
                        const res = await api.method('pwa_app.api.attendance.check_in', geo);
                        const data = res.message || {};
                        if (!data.success) { toast(data.message || 'Check-in failed', 'error'); return; }
                        if (data.warning) toast(data.warning, 'warning', 8000);
                        toast('Checked in!', 'success');
                        await loadAll();
                        if (data.checkin_name) {
                            selfieCheckinName.value = data.checkin_name;
                            showSelfieModal.value = true;
                        }
                        startLocationTracking();
                    } catch (e) { toast('Failed: ' + (e.message || 'Unknown'), 'error'); }
                    finally { attLoading.value = false; }
                }

                function queueOfflineCheckin(item) {
                    try {
                        const queue = JSON.parse(localStorage.getItem('offline_checkin_queue') || '[]');
                        queue.push(item);
                        localStorage.setItem('offline_checkin_queue', JSON.stringify(queue));
                    } catch (e) {}
                }

                async function syncOfflineQueue() {
                    try {
                        const raw = localStorage.getItem('offline_checkin_queue');
                        if (!raw) return;
                        const queue = JSON.parse(raw);
                        if (!queue.length) return;
                        const remaining = [];
                        for (const item of queue) {
                            try {
                                const method = item.action === 'check_in' ? 'pwa_app.api.attendance.check_in' : 'pwa_app.api.attendance.check_out';
                                const res = await api.method(method, {});
                                const data = res.message || {};
                                if (data.success) {
                                    toast('Offline ' + (item.action === 'check_in' ? 'check-in' : 'check-out') + ' synced!', 'success');
                                } else {
                                    remaining.push(item);
                                }
                            } catch (e) {
                                remaining.push(item);
                            }
                        }
                        localStorage.setItem('offline_checkin_queue', JSON.stringify(remaining));
                    } catch (e) {}
                }

                async function checkOut() {
                    attLoading.value = true;
                    if (!navigator.onLine) {
                        toast('You are offline. Check-out will be queued.', 'info', 5000);
                        queueOfflineCheckin({ action: 'check_out', time: Date.now() });
                        await loadAll();
                        attLoading.value = false;
                        return;
                    }
                    try {
                        const geo = await getGeoLocation();
                        const res = await api.method('pwa_app.api.attendance.check_out', geo);
                        const data = res.message || {};
                        if (!data.success) { toast(data.message || 'Check-out failed', 'error'); return; }
                        toast('Checked out!', 'success');
                        await loadAll();
                        stopLocationTracking();
                    } catch (e) { toast('Failed: ' + (e.message || 'Unknown'), 'error'); }
                    finally { attLoading.value = false; }
                }

                async function uploadSelfie() {
                    if (!selfieImage.value || !selfieCheckinName.value) return;
                    selfieUploading.value = true;
                    try {
                        const blob = await (await fetch(selfieImage.value)).blob();
                        const formData = new FormData();
                        formData.append('file', blob, 'selfie.jpg');
                        formData.append('checkin_name', selfieCheckinName.value);
                        await api.upload('pwa_app.api.attendance.upload_checkin_selfie', formData);
                        toast('Selfie saved!', 'success');
                        showSelfieModal.value = false;
                        selfieImage.value = null;
                    } catch (e) { toast('Selfie failed: ' + (e.message || 'Error'), 'error'); }
                    finally { selfieUploading.value = false; }
                }

                function skipSelfie() {
                    showSelfieModal.value = false;
                    selfieImage.value = null;
                }

                function retakeSelfie() {
                    selfieImage.value = null;
                }

                function onSelfieFile(e) {
                    const file = e.target.files?.[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => { selfieImage.value = ev.target.result; };
                        reader.readAsDataURL(file);
                    }
                }

                function startLocationTracking() {
                    if (locationInterval) clearInterval(locationInterval);
                    if (!navigator.geolocation) return;
                    locationInterval = setInterval(async () => {
                        if (!status.checked_in) { clearInterval(locationInterval); locationInterval = null; return; }
                        navigator.geolocation.getCurrentPosition(async (pos) => {
                            try {
                                await api.method('pwa_app.api.location.update_location', {
                                    latitude: pos.coords.latitude,
                                    longitude: pos.coords.longitude,
                                    accuracy: pos.coords.accuracy,
                                });
                            } catch (e) {}
                        }, () => {}, { timeout: 10000, enableHighAccuracy: false });
                    }, 600000);
                }

                function stopLocationTracking() {
                    if (locationInterval) { clearInterval(locationInterval); locationInterval = null; }
                }

                async function submitAdvance() {
                    if (!advanceForm.amount || parseFloat(advanceForm.amount) < 1) { toast('Enter a valid amount', 'warning'); return; }
                    advSubmitting.value = true;
                    try {
                        await api.method('pwa_app.api.advance.create_advance', {
                            amount: parseFloat(advanceForm.amount),
                            purpose: advanceForm.purpose || '',
                            repayment_months: parseInt(advanceForm.repayment_months) || 1,
                        });
                        advSuccess.value = true;
                        await loadAll();
                    } catch (e) { toast('Failed: ' + (e.message || JSON.stringify(e)), 'error'); }
                    finally { advSubmitting.value = false; }
                }

                async function handleApprove(r) {
                    actionLoading.value = true;
                    try {
                        await api.method('pwa_app.api.attendance.approve_request', { doctype: r.type, name: r.name });
                        toast(r.type + ' approved!', 'success');
                        await loadAll();
                    } catch (e) { toast('Failed: ' + e.message, 'error'); }
                    finally { actionLoading.value = false; }
                }

                async function handleReject(r) {
                    actionLoading.value = true;
                    try {
                        await api.method('pwa_app.api.attendance.reject_request', { doctype: r.type, name: r.name });
                        toast(r.type + ' rejected', 'info');
                        await loadAll();
                    } catch (e) { toast('Failed: ' + e.message, 'error'); }
                    finally { actionLoading.value = false; }
                }

                onMounted(() => {
                    loadAll();
                    window.addEventListener("online", syncOfflineQueue);
                });
                onUnmounted(() => {
                    window.removeEventListener("online", syncOfflineQueue);
                });
                return { loading, attLoading, activeTab, status, myRequests, teamRequests, displayTeamRequests, teamPageSize, isHR, attType, selectedTeamReq, actionLoading, toggleDrawer, checkIn, checkOut, reqIcon, reqIconBg, reqBadge, showAdvanceOverlay, advanceForm, advSubmitting, advSuccess, monthlyDeduction, repaymentMonths, firstInstallment, calcRepayment, openAdvanceOverlay, closeAdvanceOverlay, submitAdvance, handleApprove, handleReject, showSelfieModal, selfieImage, selfieUploading, uploadSelfie, skipSelfie, retakeSelfie, onSelfieFile, userInitial };
            }
        };

        // --- Leaves ---
        const Leaves = {
            template: `
                <div class="px-4 py-6 space-y-4">
                    <div v-if="loading" class="space-y-4">
                        <div class="h-8 w-24 bg-surface-container-low rounded-full animate-pulse mb-4"></div>
                        <div class="grid grid-cols-2 gap-3"><div v-for="i in 4" :key="i" class="bg-surface-container-lowest p-4 rounded-2xl border border-outline-variant/10"><div class="h-4 w-20 bg-surface-container-low rounded-full animate-pulse mb-2"></div><div class="h-6 w-16 bg-surface-container-low rounded-full animate-pulse"></div></div></div>
                    </div>
                    <template v-else>
                        <div class="flex items-center justify-between">
                            <h2 class="text-headline-lg text-on-surface">Leaves</h2>
                            <button @click="showForm = !showForm" class="px-4 py-2 rounded-full bg-primary text-white text-label-md font-bold active:scale-95 transition-all">{{ showForm ? 'Cancel' : 'Apply' }}</button>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div v-for="b in balances" :key="b.type" class="bg-surface-container-lowest p-4 rounded-2xl border border-outline-variant/10 soft-shadow">
                                <p class="text-label-sm text-outline">{{ b.type }}</p>
                                <p class="text-headline-md font-bold text-on-surface mt-1">{{ b.remaining }}</p>
                                <p class="text-label-sm text-outline">of {{ b.allocated }} remaining</p>
                            </div>
                        </div>

                        <div v-if="showForm" class="bg-surface-container-lowest p-5 rounded-2xl border border-outline-variant/10 soft-shadow space-y-3">
                            <h3 class="text-label-md font-bold text-on-surface">Apply for Leave</h3>
                            <select v-model="form.leave_type" class="w-full p-3 rounded-xl border border-outline-variant/30 bg-white text-on-surface text-body-md">
                                <option value="">Select type</option>
                                <option v-for="lt in leaveTypes" :key="lt" :value="lt">{{ lt }}</option>
                            </select>
                            <div class="grid grid-cols-2 gap-3">
                                <input type="date" v-model="form.from_date" class="p-3 rounded-xl border border-outline-variant/30 bg-white text-on-surface text-body-md">
                                <input type="date" v-model="form.to_date" class="p-3 rounded-xl border border-outline-variant/30 bg-white text-on-surface text-body-md">
                            </div>
                            <textarea v-model="form.reason" class="w-full p-3 rounded-xl border border-outline-variant/30 bg-white text-on-surface text-body-md" rows="3" placeholder="Reason"></textarea>
                            <button @click="submitLeave" :disabled="submitting" class="w-full py-3 rounded-xl bg-primary text-white text-label-md font-bold active:scale-[0.98] transition-all">{{ submitting ? 'Submitting...' : 'Submit Application' }}</button>
                        </div>

                        <div class="bg-surface-container-lowest p-4 rounded-2xl border border-outline-variant/10 soft-shadow">
                            <h3 class="text-label-md font-bold text-on-surface mb-3">My Applications</h3>
                            <div v-if="myLeaves.length" class="space-y-2">
                                <div v-for="l in myLeaves" :key="l.name" class="flex items-center justify-between p-3 rounded-xl bg-surface-container-low/50">
                                    <div><p class="text-label-md font-bold text-on-surface">{{ l.leave_type }}</p><p class="text-label-sm text-outline">{{ l.from_date }} to {{ l.to_date }}</p></div>
                                    <span class="px-3 py-1 rounded-full text-label-sm font-bold" :class="leaveBadge(l.status)">{{ l.status }}</span>
                                </div>
                            </div>
                            <div v-else class="text-center py-6 text-outline text-label-sm">No applications yet</div>
                        </div>

                        <!-- Employee detail overlay -->
                        <div v-if="selectedEmp" class="fixed inset-0 z-50 bg-white overflow-y-auto">
                            <div class="sticky top-0 bg-white/95 backdrop-blur-md p-4 border-b border-outline-variant/10 flex items-center gap-3">
                                <button @click="selectedEmp = null" class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center shrink-0">
                                    <span class="material-symbols-outlined">close</span>
                                </button>
                                <h3 class="text-label-md font-bold text-on-surface flex-1 truncate">{{ selectedEmp.employee_name }}</h3>
                            </div>
                            <div class="p-4 space-y-4">
                                <div class="flex items-center gap-3">
                                    <span class="w-12 h-12 rounded-full flex items-center justify-center shrink-0" :class="selectedEmp?.checked_in ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-500'">
                                        <span class="material-symbols-outlined text-[24px]">{{ selectedEmp?.checked_in ? 'login' : 'logout' }}</span>
                                    </span>
                                    <div>
                                        <h2 class="text-headline-md font-bold text-on-surface">{{ selectedEmp.employee_name }}</h2>
                                        <p class="text-label-sm text-outline">{{ selectedEmp.designation }} &middot; {{ selectedEmp.department }}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div class="bg-surface-container-low p-3 rounded-xl">
                                        <p class="text-label-sm text-outline">Status</p>
                                        <p class="text-label-md font-bold text-on-surface mt-1" :class="selectedEmp?.checked_in ? 'text-green-600' : 'text-gray-500'">{{ selectedEmp?.checked_in ? 'Checked In' : 'Not Checked In' }}</p>
                                    </div>
                                    <div class="bg-surface-container-low p-3 rounded-xl">
                                        <p class="text-label-sm text-outline">Attendance Type</p>
                                        <p class="text-label-md font-bold text-on-surface mt-1">{{ selectedEmp.attendance_type }}</p>
                                    </div>
                                    <div v-if="selectedEmp.check_in_time" class="bg-surface-container-low p-3 rounded-xl">
                                        <p class="text-label-sm text-outline">Check In</p>
                                        <p class="text-label-md font-bold text-on-surface mt-1">{{ formatTime(selectedEmp.check_in_time) }}</p>
                                    </div>
                                    <div v-if="selectedEmp.check_out_time" class="bg-surface-container-low p-3 rounded-xl">
                                        <p class="text-label-sm text-outline">Check Out</p>
                                        <p class="text-label-md font-bold text-on-surface mt-1">{{ formatTime(selectedEmp.check_out_time) }}</p>
                                    </div>
                                    <div class="bg-surface-container-low p-3 rounded-xl">
                                        <p class="text-label-sm text-outline">Geofence</p>
                                        <p class="text-label-md font-bold text-on-surface mt-1" :class="selectedEmp.within_geofence ? 'text-green-600' : 'text-orange-600'">{{ selectedEmp.within_geofence ? 'Within area' : 'Outside area' }}</p>
                                    </div>
                                    <div class="bg-surface-container-low p-3 rounded-xl">
                                        <p class="text-label-sm text-outline">Punches</p>
                                        <p class="text-label-md font-bold text-on-surface mt-1">{{ selectedEmp.punches }}</p>
                                    </div>
                                </div>
                                <div v-if="selectedEmp.latitude && selectedEmp.longitude" class="bg-surface-container-low p-3 rounded-xl">
                                    <p class="text-label-sm text-outline mb-2">Location</p>
                                    <p class="text-label-sm text-on-surface">Lat: {{ selectedEmp.latitude }}, Lng: {{ selectedEmp.longitude }}</p>
                                    <a :href="selectedEmp.map_url" target="_blank" class="mt-2 inline-flex items-center gap-1 px-4 py-2 rounded-lg bg-primary text-white text-label-sm font-bold">
                                        <span class="material-symbols-outlined text-[16px]">location_on</span> Open in Maps
                                    </a>
                                </div>
                                <div v-if="selectedEmp.selfie_url" class="bg-surface-container-low p-3 rounded-xl">
                                    <p class="text-label-sm text-outline mb-2">Selfie</p>
                                    <img :src="selectedEmp.selfie_url" class="w-full max-w-xs rounded-xl border border-outline-variant/10">
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            `,
            setup() {
                const loading = ref(true);
                const submitting = ref(false);
                const showForm = ref(false);
                const balances = ref([]);
                const myLeaves = ref([]);
                const leaveTypes = ref([]);
                const form = reactive({ leave_type: "", from_date: "", to_date: "", reason: "" });

                function leaveBadge(s) {
                    return { "Draft": "bg-gray-100 text-gray-600", "Applied": "bg-blue-100 text-blue-600", "Approved": "bg-green-100 text-green-600", "Rejected": "bg-red-100 text-red-600" }[s] || "bg-gray-100 text-gray-600";
                }

                async function loadLeaves() {
                    loading.value = true;
                    try {
                        const [statsRes, configRes, empRes] = await Promise.allSettled([
                            api.method('pwa_app.api.dashboard.get_dashboard_stats'),
                            api.method('pwa_app.api.utils.get_app_config'),
                            api.resource("Employee").list([["user_id", "=", SESSION.user]], ["name"], 1),
                        ]);
                        if (statsRes.status === 'fulfilled') {
                            const stats = statsRes.value.message || {};
                            balances.value = stats.leaves?.balances || [];
                        }
                        if (configRes.status === 'fulfilled') {
                            leaveTypes.value = configRes.value.message?.leave_types || ["Casual Leave", "Sick Leave", "Privilege Leave", "Leave Without Pay", "Compensatory Off"];
                        }
                        if (empRes.status === 'fulfilled' && empRes.value.data?.length) {
                            const leaveRes = await api.resource("Leave Application").list([["employee", "=", empRes.value.data[0].name], ["docstatus", "!=", 2]], ["name","leave_type","from_date","to_date","total_leave_days","status"], 20);
                            myLeaves.value = (leaveRes.data || []).reverse();
                        }
                    } catch (e) { console.error(e); }
                    finally { loading.value = false; }
                }

                async function submitLeave() {
                    if (!form.leave_type || !form.from_date || !form.to_date) { toast("Fill all required fields", "warning"); return; }
                    submitting.value = true;
                    try {
                        const empRes = await api.resource("Employee").list([["user_id", "=", SESSION.user]], ["name"], 1);
                        if (!empRes.data?.length) { toast("No employee record", "error"); return; }
                        await api.resource("Leave Application").create({ employee: empRes.data[0].name, leave_type: form.leave_type, from_date: form.from_date, to_date: form.to_date, description: form.reason });
                        toast("Leave submitted!", "success");
                        showForm.value = false; form.leave_type = ""; form.from_date = ""; form.to_date = ""; form.reason = "";
                        await loadLeaves();
                    } catch (e) { toast("Failed: " + (e.message || JSON.stringify(e)), "error"); }
                    finally { submitting.value = false; }
                }

                onMounted(loadLeaves);
                return { loading, submitting, showForm, balances, myLeaves, leaveTypes, form, leaveBadge, submitLeave };
            }
        };

        // --- Expenses ---
        const Expenses = {
            template: `
                <div class="px-4 py-6 space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-headline-lg text-on-surface">Expenses</h2>
                        <button @click="showForm = !showForm" class="px-4 py-2 rounded-full bg-primary text-white text-label-md font-bold active:scale-95 transition-all">{{ showForm ? 'Cancel' : 'New' }}</button>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-surface-container-lowest p-3 rounded-2xl border border-outline-variant/10 soft-shadow text-center"><p class="text-headline-md font-bold text-on-surface">{{ stats.pending }}</p><p class="text-label-sm text-outline">Pending</p></div>
                        <div class="bg-surface-container-lowest p-3 rounded-2xl border border-outline-variant/10 soft-shadow text-center"><p class="text-headline-md font-bold text-green-600">{{ stats.approved }}</p><p class="text-label-sm text-outline">Approved</p></div>
                        <div class="bg-surface-container-lowest p-3 rounded-2xl border border-outline-variant/10 soft-shadow text-center"><p class="text-headline-md font-bold text-primary">\u20B9{{ formatAmt(stats.amount) }}</p><p class="text-label-sm text-outline">Total</p></div>
                    </div>

            setup() {
                const loading = ref(true);
                const profile = reactive({ full_name: '', roles: [], user: '' });
